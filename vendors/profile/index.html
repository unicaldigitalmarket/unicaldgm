<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Store Profile | UNICAL Digital Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../asset/style.css">
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../../apple-touch-icon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root { 
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        /* 🚀 MODERN APP LAYOUT */
        body, html { 
            font-family: 'Inter', sans-serif;
            background: #e2e8f0; margin: 0; padding: 0; 
            overflow-x: hidden; display: flex; justify-content: center;
            color: var(--text-main);
        }
        
        .app-container { 
            background: #f8fafc; width: 100%; max-width: 480px; 
            min-height: 100vh; padding-bottom: 80px; position: relative; 
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }
        
        /* 🚀 STICKY TOP BAR */
        .sticky-top-bar { 
            position: fixed; top: 0; width: 100%; max-width: 480px; 
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; 
            z-index: 1000; background: rgba(248, 250, 252, 0.95); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); box-sizing: border-box;
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .icon-btn-overlay { 
            background: white; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; border: 1px solid #e2e8f0; 
            font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .icon-btn-overlay:active { transform: scale(0.9); background: #f1f5f9; }

        /* 🚀 PREMIUM COVER PHOTO */
        .profile-cover { 
            margin-top: 60px; height: 160px; position: relative; 
            background: linear-gradient(135deg, var(--brand-color), #ea580c, #0f172a); 
            border-radius: 0 0 32px 32px; overflow: hidden; 
            display: flex; justify-content: center; align-items: center; 
        }
        .profile-cover::before { 
            content: "UNICAL DGM"; position: absolute; font-size: 55px; font-weight: 900; 
            color: rgba(255,255,255,0.06); transform: rotate(-10deg); white-space: nowrap; pointer-events: none; 
        }

        /* 🚀 FLOATING PROFILE CARD */
        .profile-card { 
            background: white; margin: -60px 20px 20px; border-radius: 24px; padding: 25px 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; text-align: center; 
            border: 1px solid #f1f5f9; 
        }
        .v-logo { 
            width: 110px; height: 110px; border-radius: 50%; border: 4px solid white; 
            background: #f8fafc; object-fit: cover; margin-top: -65px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.08); 
        }
        .v-name { font-size: 22px; font-weight: 900; color: var(--text-main); margin: 12px 0 6px; display: flex; justify-content: center; align-items: center; gap: 6px; letter-spacing: -0.5px;}
        .v-categories { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 12px; }
        .cat-tag { background: #eff6ff; color: #2563EB; font-size: 11px; font-weight: 800; padding: 6px 14px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;}
        .v-location { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .v-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; font-weight: 500; margin-bottom: 25px; background: #f8fafc; padding: 18px; border-radius: 20px; border: 1px solid #f1f5f9;}
        
        .v-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .btn-wa { background: #25D366; color: white; padding: 16px 24px; border-radius: 16px; font-weight: 800; font-size: 15px; border: none; cursor: pointer; display: inline-flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3); text-decoration: none; width: 100%; transition: 0.2s; }
        .btn-wa:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2);}
        .report-btn { color: #ef4444; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; padding: 10px; border-radius: 12px; transition: 0.2s;}
        .report-btn:active { background: #fef2f2; }

        /* 🚀 REVIEWS SECTION */
        .reviews-section { background: white; margin: 0 20px 25px; border-radius: 24px; padding: 25px 20px; border: 1px solid #f1f5f9; box-shadow: 0 8px 30px rgba(0,0,0,0.03); }
        .rev-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .rev-title { font-size: 18px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -0.3px;}
        .write-rev-btn { background: #fffbeb; color: #f59e0b; border: 1px solid #fde68a; padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.1);}
        .write-rev-btn:active { transform: scale(0.95); }
        
        .rating-big { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .rating-num { font-size: 42px; font-weight: 900; color: var(--text-main); line-height: 1; letter-spacing: -1px;}
        .rating-stars { color: #F5A623; font-size: 18px; margin-bottom: 2px; }
        .rating-count { font-size: 13px; color: var(--text-muted); font-weight: 600; }

        .reviews-list { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; scrollbar-width: none; scroll-snap-type: x mandatory; margin: 0 -5px; padding: 5px; }
        .reviews-list::-webkit-scrollbar { display: none; }
        
        /* 🚀 GRID BLOWOUT FIX FOR REVIEW CARDS */
        .rev-card { min-width: 280px; max-width: 280px; background: white; padding: 18px; border-radius: 20px; scroll-snap-align: start; border: 1px solid #f1f5f9; position: relative; box-sizing: border-box; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
        .r-name { font-size: 14px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .r-stars { color: #F5A623; font-size: 11px; margin-bottom: 10px; }
        .r-text { font-size: 13px; color: var(--text-muted); line-height: 1.6; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

        /* 🚀 DYNAMIC GRIDS */
        .section-heading { font-size: 18px; font-weight: 900; color: var(--text-main); margin: 35px 20px 20px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px;}
        .items-grid, .vendors-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        
        /* 🚀 GRID BLOWOUT FIX FOR PRODUCT CARDS */
        .product-card { background: white; border-radius: 20px; padding: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.03); cursor: pointer; border: 1px solid #f1f5f9; width: 100%; min-width: 0; box-sizing: border-box; overflow: hidden; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);}
        .product-card:active { transform: scale(0.97); background: #f8fafc;}
        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 14px; background: #f1f5f9; margin-bottom: 12px; }
        .product-price { font-size: 16px; font-weight: 900; color: var(--brand-color); margin-bottom: 4px; }
        .product-title { font-size: 14px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; letter-spacing: -0.3px;}

        /* 🚀 GRID BLOWOUT FIX FOR VENDOR CARDS */
        .vendor-mini-card { background: white; border-radius: 20px; padding: 18px 12px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; cursor: pointer; width: 100%; min-width: 0; box-sizing: border-box; overflow: hidden; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);}
        .vendor-mini-card:active { transform: scale(0.97); background: #f8fafc;}
        .vendor-mini-img { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 12px; border: 2px solid #f8fafc; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}
        .vendor-mini-name { font-size: 14px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

        .view-all-btn { display: flex; justify-content: center; align-items: center; background: white; color: var(--text-main); padding: 16px; border-radius: 16px; font-weight: 800; font-size: 14px; text-decoration: none; margin: 25px 20px 0; border: 2px solid #e2e8f0; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,0,0,0.02);}
        .view-all-btn:active { transform: scale(0.98); background: #f8fafc; color: var(--brand-color); border-color: var(--brand-color);}

        /* 🚀 NATIVE MODAL OVERLAY */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 5000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-sizing: border-box;}
        .modal-content { background: white; width: 100%; max-width: 400px; border-radius: 28px; padding: 30px 25px; position: relative; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: popUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);}
        @keyframes popUp { from { transform: scale(0.95) translateY(10px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #94a3b8; cursor: pointer; transition: 0.2s;}
        .close-modal:active { color: var(--text-main); transform: scale(0.9);}
        
        .star-selector { display: flex; justify-content: center; gap: 12px; margin: 25px 0; font-size: 38px; color: #e2e8f0; cursor: pointer; }
        .star-selector i.active { color: #F5A623; text-shadow: 0 4px 15px rgba(245, 166, 35, 0.4);}
        .rev-input { width: 100%; height: 120px; padding: 18px; border-radius: 18px; border: 2px solid #e2e8f0; font-size: 14px; font-weight: 500; resize: none; margin-bottom: 25px; background: #f8fafc; outline: none; box-sizing: border-box; font-family: inherit; transition: 0.2s;}
        .rev-input:focus { border-color: #F5A623; background: white; box-shadow: 0 4px 15px rgba(245, 166, 35, 0.1);}
        .submit-btn { background: var(--brand-gradient); color: white; width: 100%; padding: 16px; border: none; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 8px 25px rgba(255, 122, 0, 0.3); transition: 0.2s;}
        .submit-btn:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(255, 122, 0, 0.2);}

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-logo { width: 110px; height: 110px; border-radius: 50%; margin: -65px auto 12px; border: 5px solid white; }
        .sk-line { height: 14px; border-radius: 6px; margin: 12px auto; }
        .sk-vendor { background: white; border-radius: 20px; padding: 18px 12px; border: 1px solid #f1f5f9; display: flex; flex-direction: column; align-items: center; }
        
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.3s; }
        .loader-overlay.hidden { opacity: 0; pointer-events: none; }
        .loader-spinner { width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: var(--brand-color); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR VENDOR PROFILE     */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .sticky-top-bar { background: rgba(15, 23, 42, 0.95) !important; box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important; border-bottom: 1px solid #334155; }
        body.dark-mode .sticky-top-bar div { color: #f1f5f9 !important; }
        body.dark-mode .icon-btn-overlay { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important;}
        body.dark-mode .icon-btn-overlay:active { background: #334155 !important; }
        
        body.dark-mode .profile-cover { background: linear-gradient(135deg, #FF7A00, #ea580c, #020617) !important; }
        
        body.dark-mode .profile-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;}
        body.dark-mode .v-logo { border-color: #1e293b !important; background: #0f172a !important; }
        body.dark-mode .v-name { color: #f1f5f9 !important; }
        body.dark-mode .v-location { color: #94a3b8 !important; }
        body.dark-mode .v-desc { color: #cbd5e1 !important; background: #0f172a !important; border-color: #334155 !important;}
        body.dark-mode .cat-tag { background: #0f172a !important; color: #38bdf8 !important; border: 1px solid #334155 !important;}
        body.dark-mode .report-btn { color: #ef4444 !important; }
        body.dark-mode .report-btn:active { background: rgba(239, 68, 68, 0.1) !important;}

        body.dark-mode .reviews-section { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;}
        body.dark-mode .rev-title { color: #f1f5f9 !important; }
        body.dark-mode .write-rev-btn { background: #0f172a !important; border-color: #334155 !important; color: #fbbf24 !important; box-shadow: none !important;}
        body.dark-mode .rating-num { color: #f1f5f9 !important; }
        body.dark-mode .rating-count { color: #94a3b8 !important; }
        body.dark-mode .rev-card { background: #0f172a !important; border-color: #334155 !important; box-shadow: none !important;}
        body.dark-mode .r-name { color: #f1f5f9 !important; }
        body.dark-mode .r-text { color: #cbd5e1 !important; }

        body.dark-mode .section-heading { color: #f1f5f9 !important; }
        
        body.dark-mode .product-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 8px 25px rgba(0,0,0,0.5) !important; }
        body.dark-mode .product-card:active { background: #334155 !important; }
        body.dark-mode .product-img { background: #0f172a !important; }
        body.dark-mode .product-title { color: #f1f5f9 !important; }
        body.dark-mode .product-card .product-price { color: var(--brand-color) !important; } 

        body.dark-mode .vendor-mini-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 8px 25px rgba(0,0,0,0.5) !important;}
        body.dark-mode .vendor-mini-card:active { background: #334155 !important; }
        body.dark-mode .vendor-mini-name { color: #f1f5f9 !important; }
        body.dark-mode .vendor-mini-img { border-color: #334155 !important; background: #0f172a !important;}

        body.dark-mode .view-all-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; box-shadow: none !important;}
        body.dark-mode .view-all-btn:active { background: #334155 !important; border-color: var(--brand-color) !important; color: var(--brand-color) !important;}

        body.dark-mode .modal-bg { background: rgba(2, 6, 23, 0.8) !important;}
        body.dark-mode .modal-content { background: #0f172a !important; border: 1px solid #334155; box-shadow: 0 25px 50px rgba(0,0,0,0.5) !important;}
        body.dark-mode #modal-title { color: #f1f5f9 !important; }
        body.dark-mode .rev-input { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
        body.dark-mode .rev-input:focus { border-color: #F5A623 !important; }
        
        body.dark-mode .loader-overlay { background: #020617 !important; }
        
        /* Dark Mode Skeletons */
        body.dark-mode .sk-vendor, body.dark-mode .sk-card { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .sk-logo { border-color: #1e293b !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<body data-page-id="vendor-profile">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>
    
      <div id="page-loader" class="loader-overlay">
        <div class="loader-spinner"></div>
    </div>
    
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('page-loader');
                if (loader) {
                    loader.classList.add('hidden');
                }
            }, 1000); // Smoother, faster fade
        });
    </script>


    <div class="app-container">
        
        <div class="sticky-top-bar">
            <button class="icon-btn-overlay" onclick="smartBack()"><i class="fas fa-arrow-left"></i></button>
            <div style="font-weight: 900; font-size: 16px; letter-spacing: -0.3px;">Store Profile</div>
            <button class="icon-btn-overlay" onclick="shareStore()"><i class="fas fa-share-alt"></i></button>
        </div>

        <div class="profile-cover"></div>

        <div id="skeleton-view">
            <div class="profile-card">
                <div class="sk-shimmer sk-logo"></div>
                <div class="sk-shimmer sk-line" style="width: 60%; height: 24px;"></div>
                <div class="sk-shimmer sk-line" style="width: 40%;"></div>
                <div class="sk-shimmer sk-line" style="width: 80%; margin-top: 20px;"></div>
                <div class="sk-shimmer sk-line" style="width: 70%;"></div>
            </div>
            
            <div class="section-heading"><div class="sk-shimmer sk-line" style="width: 150px; height: 20px; margin:0;"></div></div>
            <div class="items-grid">
                <div class="product-card"><div class="sk-shimmer" style="height:140px; border-radius:14px; margin-bottom:12px;"></div><div class="sk-shimmer sk-line" style="width: 50%;"></div><div class="sk-shimmer sk-line" style="width: 80%;"></div></div>
                <div class="product-card"><div class="sk-shimmer" style="height:140px; border-radius:14px; margin-bottom:12px;"></div><div class="sk-shimmer sk-line" style="width: 50%;"></div><div class="sk-shimmer sk-line" style="width: 80%;"></div></div>
            </div>

            <div class="section-heading" style="margin-top: 40px;"><div class="sk-shimmer sk-line" style="width: 180px; height: 20px; margin:0;"></div></div>
            <div class="vendors-grid">
                <div class="sk-vendor"><div class="sk-shimmer" style="width:70px; height:70px; border-radius:50%; margin-bottom:12px;"></div><div class="sk-shimmer sk-line" style="width:80%;"></div></div>
                <div class="sk-vendor"><div class="sk-shimmer" style="width:70px; height:70px; border-radius:50%; margin-bottom:12px;"></div><div class="sk-shimmer sk-line" style="width:80%;"></div></div>
            </div>
        </div>

        <div id="real-view" style="display: none;">
            <div class="profile-card" id="vendor-details">
                <img src="" id="v-logo" class="v-logo">
                <div class="v-name" id="v-name">Loading...</div>
                
                <div class="v-categories" id="v-cats"></div>
                <div class="v-location" id="v-loc"><i class="fas fa-map-marker-alt"></i> Loading...</div>

                <div class="v-desc" id="v-desc">...</div>

                <div class="v-actions">
                    <a href="#" id="wa-link" target="_blank" class="btn-wa"><i class="fab fa-whatsapp" style="font-size: 20px;"></i> Message Store</a>
                    <a href="../../report/index.html" id="report-link" class="report-btn"><i class="fas fa-flag"></i> Report Vendor</a>
                </div>
            </div>

            <div class="reviews-section">
                <div class="rev-header">
                    <h3 class="rev-title">Store Reviews</h3>
                    <button class="write-rev-btn" onclick="openReviewModal()">Write Review</button>
                </div>
                
                <div class="rating-big">
                    <div class="rating-num" id="avg-num">0.0</div>
                    <div>
                        <div class="rating-stars" id="avg-stars">☆☆☆☆☆</div>
                        <div class="rating-count" id="total-revs">0 reviews</div>
                    </div>
                </div>

                <div class="reviews-list" id="reviews-list"></div>
            </div>

            <div class="section-heading"><i class="fas fa-shopping-bag" style="color: var(--brand-color);"></i> Store Items <span id="store-items-count" style="color: var(--text-muted); font-size: 14px; font-weight: 700; margin-left: 6px;">(0)</span></div>
            <div class="items-grid" id="store-items"></div>

            <div class="section-heading" style="margin-top: 45px;"><i class="fas fa-compass" style="color: #F5A623;"></i> Explore More Items</div>
            <div class="items-grid" id="explore-items"></div>
            <a href="../../items/index.html" class="view-all-btn">View All Market Items</a>

            <div class="section-heading" style="margin-top: 45px;"><i class="fas fa-store" style="color: #10b981;"></i> Discover Other Vendors</div>
            <div class="vendors-grid" id="other-vendors"></div>
            <a href="../../vendors/index.html" class="view-all-btn" style="margin-bottom: 20px;">View All Vendors</a>
        </div>

        <div class="modal-bg" id="review-modal">
            <div class="modal-content">
                <div class="close-modal" onclick="closeReviewModal()">&times;</div>
                <h3 style="margin: 0 0 8px; font-size: 22px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px;" id="modal-title">Rate this Shop</h3>
                <p style="font-size: 14px; color: var(--text-muted); margin: 0; font-weight: 500;">Help other students buy safely.</p>
                
                <div class="star-selector" id="star-selector">
                    <i class="fas fa-star" data-val="1"></i>
                    <i class="fas fa-star" data-val="2"></i>
                    <i class="fas fa-star" data-val="3"></i>
                    <i class="fas fa-star" data-val="4"></i>
                    <i class="fas fa-star" data-val="5"></i>
                </div>
                <input type="hidden" id="selected-rating" value="0">
                <input type="hidden" id="edit-review-id" value="">
                
                <textarea id="review-text" class="rev-input" placeholder="Share your experience..."></textarea>
                <button class="submit-btn" id="submit-rev-btn" onclick="submitReview()">Post Review</button>
            </div>
        </div>

    </div>

    <script src="../../asset/script.js"></script>

   <script>
        let currentUser = null;
        let currentVendor = null;
        let vendorId = new URLSearchParams(window.location.search).get('id');

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        // 🎲 Randomizer Function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 🚀 SMART BACK BUTTON (Retains WhatsApp referrer logic)
        window.smartBack = function() {
            if (window.history.length <= 1 || document.referrer === "" || document.referrer.includes('wa.me') || !document.referrer.includes(window.location.host)) {
                window.location.href = "../../index.html"; 
            } else {
                window.history.back(); 
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;
            
            if (!vendorId) {
                alert("Vendor not found!"); window.location.href = "../../vendors/index.html"; return;
            }

            setupStars();
            await loadVendorProfile();
            await loadReviews();
            await loadStoreItems();
            await loadExploreItems();
            await loadOtherVendors();

            document.getElementById('skeleton-view').style.display = 'none';
            document.getElementById('real-view').style.display = 'block';
        });

        async function loadVendorProfile() {
            const { data: vendor, error } = await supabaseClient.from('vendors').select('*').eq('id', vendorId).single();
            if (error || !vendor) {
                document.getElementById('v-name').innerText = "Store Not Found"; return;
            }
            currentVendor = vendor;
            document.title = `${vendor.business_name} | Profile`;

            let badgeColor = "#38bdf8"; 
            if (vendor.subscription_plan === "Influencer") badgeColor = "#fbbf24"; 
            if (vendor.subscription_plan === "Icon") badgeColor = "#1e293b"; 
            
            // Dark mode override for Icon badge
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'dark' && vendor.subscription_plan === "Icon") badgeColor = "#f1f5f9";

            document.getElementById('v-name').innerHTML = `${escapeHTML(vendor.business_name)} <i class="fas fa-check-circle" style="color: ${badgeColor}; font-size: 18px;"></i>`;
            document.getElementById('v-logo').src = escapeHTML(vendor.logo_url) || "https://via.placeholder.com/150";
            document.getElementById('v-desc').innerText = vendor.description || "No description provided.";
            document.getElementById('v-loc').innerHTML = `<i class="fas fa-map-marker-alt"></i> ${escapeHTML(vendor.location) || "Location not provided"}`;

            const catBox = document.getElementById('v-cats');
            catBox.innerHTML = "";
            if (vendor.categories) {
                vendor.categories.split(',').forEach(cat => {
                    catBox.insertAdjacentHTML('beforeend', `<span class="cat-tag">${escapeHTML(cat.trim())}</span>`);
                });
            }

            let phone = vendor.whatsapp_number || "";
            if(phone.startsWith('0')) phone = "234" + phone.substring(1);
            document.getElementById('wa-link').href = `https://wa.me/${phone}`;
            document.getElementById('report-link').href = `../../report/index.html?vid=${escapeJS(vendor.id)}&vname=${encodeURIComponent(vendor.business_name)}`;
        }

        async function loadReviews() {
            const list = document.getElementById('reviews-list');
            try {
                const { data: reviews, error } = await supabaseClient.from('vendor_reviews').select('*').eq('vendor_id', vendorId).order('created_at', { ascending: false });
                if (error) throw error;

                if (!reviews || reviews.length === 0) {
                    list.innerHTML = `<p style="color: var(--text-muted); font-weight: 500; font-size: 14px; width: 100%; text-align: center;">No reviews yet. Be the first!</p>`;
                    return;
                }

                const userIds = [...new Set(reviews.map(r => r.customer_id))];
                const { data: profiles } = await supabaseClient.from('profiles').select('id, full_name').in('id', userIds);
                const profileDict = {};
                if (profiles) profiles.forEach(p => profileDict[p.id] = p.full_name);

                let total = 0; list.innerHTML = "";

                reviews.forEach(r => {
                    total += r.rating;
                    const starsHTML = '<i class="fas fa-star"></i>'.repeat(r.rating) + '<i class="far fa-star"></i>'.repeat(5 - r.rating);
                    const name = escapeHTML(profileDict[r.customer_id] || "Student");
                    const safeTextHTML = escapeHTML(r.review_text);
                    
                    let actionBtns = '';
                    if (currentUser && currentUser.id === r.customer_id) {
                        const safeTextJS = escapeJS(r.review_text);
                        actionBtns = `
                            <div style="margin-top: 15px; display: flex; gap: 10px;">
                                <button onclick="triggerEdit('${escapeJS(r.id)}', '${safeTextJS}', ${r.rating})" style="background:#eff6ff; color:#2563EB; border:none; padding:6px 12px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; transition:0.2s;"><i class="fas fa-edit"></i> Edit</button>
                                <button onclick="triggerDelete('${escapeJS(r.id)}')" style="background:#fef2f2; color:#ef4444; border:none; padding:6px 12px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; transition:0.2s;"><i class="fas fa-trash"></i> Delete</button>
                            </div>
                        `;
                    }
                    
                    list.insertAdjacentHTML('beforeend', `
                        <div class="rev-card">
                            <div class="r-name">${name}</div>
                            <div class="r-stars">${starsHTML}</div>
                            <div class="r-text">"${safeTextHTML}"</div>
                            ${actionBtns}
                        </div>
                    `);
                });

                const avg = (total / reviews.length).toFixed(1);
                document.getElementById('avg-num').innerText = avg;
                document.getElementById('avg-stars').innerHTML = '<i class="fas fa-star"></i>'.repeat(Math.round(avg));
                document.getElementById('total-revs').innerText = `${reviews.length} reviews`;

            } catch (err) {
                list.innerHTML = `<p style="color: #ef4444; font-weight: 600; font-size: 14px; width: 100%; text-align: center;">Failed to load reviews.</p>`;
            }
        }

        async function loadStoreItems() {
            const grid = document.getElementById('store-items');
            const { data: products } = await supabaseClient.from('products').select('*').eq('vendor_id', vendorId).eq('status', 'Active');
            
            if (!products || products.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; padding: 30px 20px;"><i class="fas fa-box-open" style="font-size: 30px; color: #cbd5e1; margin-bottom: 10px;"></i><p style="color: var(--text-muted); font-weight: 600; margin: 0;">This store has no active items.</p></div>`; return;
            }

            document.getElementById('store-items-count').innerText = `(${products.length})`;

            grid.innerHTML = "";
            products.forEach(p => {
                const img = escapeHTML((p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300');
                const price = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);
                grid.insertAdjacentHTML('beforeend', `<div class="product-card" onclick="window.location.href='../../product/index.html?id=${escapeJS(p.id)}'"><img src="${img}" class="product-img"><div class="product-price">${price}</div><div class="product-title">${escapeHTML(p.name)}</div></div>`);
            });
        }

        // 🚀 SMART EXPLORE ITEMS (Shuffles from 300, limits to 30)
        async function loadExploreItems() {
            const grid = document.getElementById('explore-items');
            
            const { data: products } = await supabaseClient.from('products')
                .select('*')
                .neq('vendor_id', vendorId)
                .eq('status', 'Active')
                .limit(300); // 300 massive pool
            
            if (!products || products.length === 0) return;
            
            const randomizedItems = shuffleArray(products).slice(0, 30); // Random 30

            grid.innerHTML = "";
            randomizedItems.forEach(p => {
                const img = escapeHTML((p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300');
                const price = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);
                grid.insertAdjacentHTML('beforeend', `<div class="product-card" onclick="window.location.href='../../product/index.html?id=${escapeJS(p.id)}'"><img src="${img}" class="product-img"><div class="product-price">${price}</div><div class="product-title">${escapeHTML(p.name)}</div></div>`);
            });
        }

        // 🚀 SMART DISCOVER VENDORS (Shuffles from 100, limits to 14)
        async function loadOtherVendors() {
            const grid = document.getElementById('other-vendors');
            
            const { data: vendors } = await supabaseClient.from('vendors')
                .select('*')
                .neq('id', vendorId)
                .eq('is_active', true)
                .limit(100); // 100 pool for solid randomness
            
            if (!vendors || vendors.length === 0) return;
            
            const randomizedVendors = shuffleArray(vendors).slice(0, 14); // Random 14

            grid.innerHTML = "";
            randomizedVendors.forEach(v => {
                const logo = escapeHTML(v.logo_url || 'https://via.placeholder.com/150');
                grid.insertAdjacentHTML('beforeend', `<div class="vendor-mini-card" onclick="window.location.href='index.html?id=${escapeJS(v.id)}'"><img src="${logo}" class="vendor-mini-img"><div class="vendor-mini-name">${escapeHTML(v.business_name)}</div></div>`);
            });
        }

        function setupStars() {
            const stars = document.querySelectorAll('#star-selector i');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const val = this.getAttribute('data-val');
                    document.getElementById('selected-rating').value = val;
                    stars.forEach(s => {
                        if(s.getAttribute('data-val') <= val) s.classList.add('active');
                        else s.classList.remove('active');
                    });
                });
            });
        }

        function openReviewModal() {
            if (!currentUser) { alert("Please log in to leave a review."); window.location.href = "../../login/index.html"; return; }
            if (currentUser.id === currentVendor.profile_id) { alert("You cannot review your own store."); return; }
            
            document.getElementById('modal-title').innerText = "Rate this Shop";
            document.getElementById('edit-review-id').value = "";
            document.getElementById('review-text').value = "";
            document.getElementById('selected-rating').value = "0";
            document.querySelectorAll('#star-selector i').forEach(s => s.classList.remove('active'));
            
            document.getElementById('review-modal').style.display = 'flex';
        }

        function closeReviewModal() { document.getElementById('review-modal').style.display = 'none'; }

        window.triggerEdit = function(id, text, rating) {
            document.getElementById('modal-title').innerText = "Edit Review";
            document.getElementById('edit-review-id').value = id;
            document.getElementById('review-text').value = text;
            document.getElementById('selected-rating').value = rating;
            
            const stars = document.querySelectorAll('#star-selector i');
            stars.forEach(s => {
                if(s.getAttribute('data-val') <= rating) s.classList.add('active');
                else s.classList.remove('active');
            });

            document.getElementById('review-modal').style.display = 'flex';
        }

        window.triggerDelete = async function(id) {
            if (!confirm("Are you sure you want to permanently delete this review?")) return;
            try {
                await supabaseClient.from('vendor_reviews').delete().eq('id', id);
                alert("Review deleted successfully.");
                await loadReviews();
            } catch(e) { alert("Failed to delete review."); }
        }

        async function submitReview() {
            const rating = parseInt(document.getElementById('selected-rating').value);
            const text = document.getElementById('review-text').value.trim();
            const editId = document.getElementById('edit-review-id').value;
            const btn = document.getElementById('submit-rev-btn');

            if (rating === 0) return alert("Please select a star rating!");
            if (text.length < 5) return alert("Please write a bit more about your experience.");

            btn.disabled = true; btn.innerText = "Posting...";

            try {
                if (editId) {
                    await supabaseClient.from('vendor_reviews').update({ rating: rating, review_text: text }).eq('id', editId);
                    alert("Review updated successfully!");
                } else {
                    const { error } = await supabaseClient.from('vendor_reviews').insert([{ vendor_id: vendorId, customer_id: currentUser.id, rating: rating, review_text: text }]);
                    if (error) {
                        if (error.code === '42501' || error.message.includes('Limit 2')) throw new Error("You have already reached the limit of 2 reviews for this store.");
                        throw error;
                    }
                    alert("Review posted successfully!");
                }

                closeReviewModal();
                await loadReviews();
            } catch (err) {
                alert(err.message || "Failed to post review.");
            } finally {
                btn.disabled = false; btn.innerText = "Post Review";
            }
        }

        window.shareStore = function() {
            if (!currentVendor) return;
            const url = window.location.href;
            const message = encodeURIComponent(`Check out ${currentVendor.business_name} on UNICAL Digital Market!\n\nStore Link: ${url}`);
            window.open(`https://api.whatsapp.com/send?text=${message}`, '_blank');
        }
    </script>
</body>
</html>
