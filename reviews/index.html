    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root {
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --brand-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            background: var(--brand-bg); width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative; z-index: 1;
        }

        /* 🚀 Glassmorphic Header */
        .header {
            background: rgba(248, 250, 252, 0.95); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; }
        .back-btn { background: white; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .back-btn:active { transform: scale(0.9); background: #f1f5f9; }
        .page-title { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -0.5px;}

        /* Write Button in Header */
        .header-write-btn {
            background: var(--brand-gradient); color: white; border: none;
            padding: 10px 18px; border-radius: 20px; font-weight: 800; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.25);
            transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .header-write-btn:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(255, 122, 0, 0.2); }

        .content-area { padding: 0 0 90px 0; flex: 1; }

        /* 🚀 Hero Section */
        .hero-section { padding: 25px 20px 15px; }
        .page-header-text { font-size: 28px; font-weight: 900; color: var(--text-main); margin: 0 0 6px; letter-spacing: -0.5px;}
        .page-subtext { color: var(--text-muted); font-size: 15px; font-weight: 500; margin: 0; line-height: 1.4;}

        /* 🚀 Filter Chips */
        .filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 20px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn {
            padding: 12px 20px; border: 1px solid #e2e8f0; background: white;
            border-radius: 24px; font-size: 14px; font-weight: 800; cursor: pointer;
            white-space: nowrap; color: var(--text-muted); transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; align-items: center; gap: 6px;
        }
        .filter-btn.active { background: var(--text-main); color: white; border-color: var(--text-main); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* 🚀 Review Cards */
        .reviews-container { padding: 0 20px; }
        .review-card {
            background: white; border-radius: 24px; padding: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;
            margin-bottom: 20px; width: 100%; box-sizing: border-box; transition: 0.2s;
            /* BUG FIX: Overriding the global homepage slider width restrictions */
            min-width: 100% !important; max-width: 100% !important;
        }
        
        .rev-header-flex { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;}
        .rev-user-info { display: flex; align-items: center; gap: 12px; }
        .rev-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #e2e8f0; border: 2px solid #f8fafc;}
        .rev-name { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 2px; letter-spacing: -0.3px;}
        .rev-date { font-size: 12px; color: #94a3b8; font-weight: 600;}
        
        .rev-stars { font-size: 13px; color: #f59e0b; margin-bottom: 12px; display: flex; gap: 3px;}
        .rev-body { font-size: 15px; line-height: 1.6; color: #334155; font-weight: 500;}

        .pending-badge { background: #fef9c3; color: #d97706; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; margin-left: 6px; vertical-align: middle; border: 1px solid #fde047;}
        
        /* Action Icons (Edit/Delete) */
        .action-icon { font-size: 15px; color: #cbd5e1; cursor: pointer; margin-left: 12px; transition: 0.2s; padding: 5px;}
        .action-icon:active { transform: scale(0.9); }
        .action-edit:hover { color: #3b82f6; }
        .action-delete:hover { color: #ef4444; }

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* 🚀 Call to Action Box */
        .cta-box { background: linear-gradient(135deg, rgba(255, 122, 0, 0.1), rgba(234, 88, 12, 0.05)); border: 1px solid rgba(255, 122, 0, 0.15); text-align: center; padding: 35px 20px; border-radius: 24px; margin: 30px 0; }
        .cta-box h3 { font-size: 18px; font-weight: 900; color: var(--text-main); margin: 0 0 8px; letter-spacing: -0.3px;}
        .cta-box p { font-size: 14px; color: var(--text-muted); margin: 0 0 20px; font-weight: 500;}
        .cta-btn { background: white; color: var(--text-main); border: 1px solid #e2e8f0; padding: 14px 25px; border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.2s; }
        .cta-btn:active { transform: scale(0.95); background: #f8fafc;}

        /* 🚀 MODERN MODAL */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .modal-content {
            background: white; padding: 35px 25px; border-radius: 30px; width: 100%; max-width: 400px;
            position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.25); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(30px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        
        .close-modal { position: absolute; top: 20px; right: 20px; width: 35px; height: 35px; border-radius: 50%; background: #f1f5f9; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #64748b; cursor: pointer; border: none; transition: 0.2s; }

        .star-selector { display: flex; justify-content: center; gap: 12px; margin: 25px 0; }

        .star-selector i.active { color: #f59e0b; text-shadow: 0 0 20px rgba(245, 158, 11, 0.4); transform: scale(1.1);}
        
        .modal-textarea {
            width: 100%; height: 130px; padding: 18px; border: 2px solid #e2e8f0; border-radius: 16px;
            outline: none; font-size: 15px; font-family: inherit; resize: none; margin-bottom: 20px;

        .modal-textarea:focus { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.1);}

        .modal-submit-btn:active { transform: scale(0.97); }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR REVIEWS PAGE       */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}

        body.dark-mode .filter-btn { background: #1e293b !important; border-color: #334155 !important; color: #94a3b8 !important; }
        body.dark-mode .filter-btn.active { background: #f1f5f9 !important; color: #0f172a !important; border-color: #f1f5f9 !important; box-shadow: 0 4px 15px rgba(255,255,255,0.1) !important;}
        
        body.dark-mode .review-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; }
        body.dark-mode .rev-name { color: #f1f5f9 !important; }
        body.dark-mode .rev-date { color: #64748b !important; }
        body.dark-mode .rev-body { color: #cbd5e1 !important; }
        body.dark-mode .rev-avatar { border-color: #0f172a !important; background: #0f172a !important; }
        
        body.dark-mode .pending-badge { background: rgba(245, 158, 11, 0.1) !important; color: #fcd34d !important; border-color: rgba(245, 158, 11, 0.3) !important;}
        
        body.dark-mode .action-icon { color: #475569 !important; }
        body.dark-mode .action-edit:hover { color: #60a5fa !important; }
        body.dark-mode .action-delete:hover { color: #f87171 !important; }
        
        body.dark-mode .cta-box { background: rgba(255, 122, 0, 0.05) !important; border-color: rgba(255, 122, 0, 0.1) !important; }
        body.dark-mode .cta-box h3 { color: #f1f5f9 !important; }
        body.dark-mode .cta-box p { color: #94a3b8 !important; }
        body.dark-mode .cta-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
        body.dark-mode .cta-btn:active { background: #334155 !important; }
        
        /* Modal Dark Mode */
        body.dark-mode .modal-content { background: #0f172a !important; box-shadow: 0 25px 60px rgba(0,0,0,0.8) !important; border: 1px solid #1e293b;}
        body.dark-mode .close-modal { background: #1e293b !important; border: 1px solid #334155; }
        body.dark-mode #modalTitle { color: #f1f5f9 !important; }
        body.dark-mode .star-selector i { color: #1e293b !important; }
        body.dark-mode .star-selector i.active { color: #f59e0b !important; text-shadow: 0 0 20px rgba(245, 158, 11, 0.5) !important;}
        body.dark-mode .modal-textarea { background: #1e293b !important; border-color: #334155 !important; color: #f1f5f9 !important; }
        body.dark-mode .modal-textarea:focus { border-color: var(--brand-color) !important; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.15) !important; }
        
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>

    <script>
        let currentUser = null;
        let allReviews = [];
        let selectedRating = 0;
        let editingReviewId = null;

        // 🚀 SMART BACK BUTTON LOGIC
        function getSmartRedirectUrl() {
            const referrer = document.referrer;
            const currentWebsite = window.location.origin;

            if (referrer && referrer.startsWith(currentWebsite) && !referrer.includes('/login/') && !referrer.includes('/reset-password/')) {
                return referrer; 
            }
            return "../index.html"; 
        }

        window.smartBack = function(event) {
            if (event) event.preventDefault();
            window.location.href = getSmartRedirectUrl();
        }

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;
            fetchReviews();
        });

        async function requireLogin(targetUrl) {
            if (currentUser) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        function timeAgo(dateString) {
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mins ago";
            return "Just now";
        }

        async function fetchReviews() {
            try {
                const { data, error } = await supabaseClient
                    .from('reviews')
                    .select('id, rating, review_text, status, created_at, reviewer_id, profiles ( full_name, avatar_url )')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allReviews = data.filter(r => r.status === 'approved' || (currentUser && r.reviewer_id === currentUser.id));
                renderReviews(allReviews);
            } catch (error) {
                document.getElementById('reviews-container').innerHTML = `<p style="text-align:center; color:#ef4444; font-weight:600; padding: 20px;">Failed to load reviews. Check your connection.</p>`;
            }
        }

        window.renderReviews = function(dataArray) {
            const container = document.getElementById('reviews-container');
            container.innerHTML = "";

            if (dataArray.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#94a3b8; font-weight:500; padding: 40px 20px;">No reviews found here.</p>`;
                return;
            }

            dataArray.forEach(r => {
                const starsHtml = '<i class="fas fa-star"></i>'.repeat(r.rating);
                const isPending = r.status === 'pending' ? `<span class="pending-badge">PENDING</span>` : '';
                
                // 🛡️ Sanitize Content
                const authorName = escapeHTML(r.profiles?.full_name || "UNICAL Student");
                const authorImg = escapeHTML(r.profiles?.avatar_url || "../img/person.png");
                const safeTextHTML = escapeHTML(r.review_text);
                const dateText = timeAgo(r.created_at);

                let actionHtml = "";
                if (currentUser && r.reviewer_id === currentUser.id) {
                    const safeTextJS = escapeJS(r.review_text);
                    const safeIdJS = escapeJS(r.id);
                    actionHtml = `
                        <div style="display:flex;">
                            <i class="fas fa-edit action-icon action-edit" onclick="openEditModal('${safeIdJS}', '${safeTextJS}', ${r.rating})"></i>
                            <i class="fas fa-trash action-icon action-delete" onclick="deleteReview('${safeIdJS}')"></i>
                        </div>
                    `;
                }

                container.insertAdjacentHTML('beforeend', `
                    <div class="review-card">
                        <div class="rev-header-flex">
                            <div class="rev-user-info">
                                <img src="${authorImg}" class="rev-avatar" onerror="this.src='../img/person.png'">
                                <div>
                                    <div class="rev-name">${authorName} ${isPending}</div>
                                    <div class="rev-date">${dateText}</div>
                                </div>
                            </div>
                            ${actionHtml}
                        </div>
                        <div class="rev-stars">${starsHtml}</div>
                        <div class="rev-body">"${safeTextHTML}"</div>
                    </div>
                `);
            });
        }

        window.filterReviews = function(rating, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            if (rating === 'all') renderReviews(allReviews);
            else renderReviews(allReviews.filter(r => r.rating === rating));
        }

        window.openReviewModal = function() {
            if (!currentUser) { 
                alert("Please log in to drop a review!"); 
                window.location.href = "../login/index.html?redirect=" + encodeURIComponent(window.location.href); 
                return; 
            }
            const myReviewCount = allReviews.filter(r => r.reviewer_id === currentUser.id).length;
            if (!editingReviewId && myReviewCount >= 2) { 
                alert("You have reached the maximum limit of 2 reviews per user."); 
                return; 
            }
            document.getElementById('reviewModal').style.display = 'flex';
        }

        window.closeReviewModal = function() {
            document.getElementById('reviewModal').style.display = 'none';
            selectedRating = 0; editingReviewId = null; updateStars();
            document.getElementById('reviewText').value = "";
            document.getElementById('reviewError').style.display = 'none';
            document.getElementById('modalTitle').innerText = "Rate your experience";
        }

        window.openEditModal = function(id, text, rating) {
            editingReviewId = id;
            document.getElementById('modalTitle').innerText = "Edit your review";
            document.getElementById('reviewText').value = text;
            selectedRating = rating;
            updateStars();
            document.getElementById('reviewModal').style.display = 'flex';
        }

        document.querySelectorAll('#starInput i').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.getAttribute('data-val'));
                updateStars();
            });
        });

        function updateStars() {
            document.querySelectorAll('#starInput i').forEach(star => {
                const val = parseInt(star.getAttribute('data-val'));
                star.className = val <= selectedRating ? 'fas fa-star active' : 'fas fa-star';
            });
        }

        window.submitReview = async function() {
            const text = document.getElementById('reviewText').value.trim();
            const errorMsg = document.getElementById('reviewError');
            
            if (selectedRating === 0) { errorMsg.innerText = "Please select a star rating."; errorMsg.style.display = 'block'; return; }
            if (text.length < 5) { errorMsg.innerText = "Review is too short. Please add more details."; errorMsg.style.display = 'block'; return; }

            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...'; 
            btn.disabled = true;

            try {
                if (editingReviewId) {
                    await supabaseClient.from('reviews').update({ rating: selectedRating, review_text: text, status: 'pending' }).eq('id', editingReviewId);
                    alert("Review updated! It is pending approval.");
                } else {
                    await supabaseClient.from('reviews').insert([{ reviewer_id: currentUser.id, rating: selectedRating, review_text: text, status: 'pending' }]);
                    alert("Review posted! It will appear as 'PENDING' until approved.");
                }
                closeReviewModal(); fetchReviews();
            } catch (error) { 
                errorMsg.innerText = "Network error. Try again."; 
                errorMsg.style.display = 'block'; 
            } 
            finally { 
                btn.innerText = "Post Review"; 
                btn.disabled = false; 
            }
        }

        window.deleteReview = async function(id) {
            if (!confirm("Are you sure you want to delete this review forever?")) return;
            try { 
                await supabaseClient.from('reviews').delete().eq('id', id); 
                fetchReviews(); 
            } catch (error) { 
                alert("Failed to delete review."); 
            }
        }
    </script>
</body>
</html>
