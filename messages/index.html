<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inbox | UNICAL Digital Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root {
            --brand-color: #FF7A00; 
            --brand-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            background: var(--brand-bg); width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative; z-index: 1;
        }

        /* 🚀 Glassmorphic Header */
        .header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(248, 250, 252, 0.95); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 15px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        
        .header-top-flex { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .page-title { font-size: 22px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -0.5px;}
        
        .content-area { padding: 0 0 90px 0; }
        .inbox-container { padding: 15px 20px; }
        
        /* 🚀 Modern Chat Cards */
        .chat-card { 
            background: white; border-radius: 20px; padding: 16px; margin-bottom: 14px; 
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            border: 1px solid #f1f5f9; box-shadow: 0 8px 25px rgba(0,0,0,0.03); transition: 0.2s;
        }
        .chat-card:active { transform: scale(0.98); background: #f8fafc; }

        .chat-avatar { 
            width: 55px; height: 55px; border-radius: 50%; object-fit: cover; 
            background: #e2e8f0; flex-shrink: 0; border: 2px solid #f8fafc; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .chat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center;}
        .chat-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .chat-name { font-size: 16px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px;}
        .chat-time { font-size: 11px; color: #94a3b8; font-weight: 700; flex-shrink: 0; margin-left: 10px; }
        
        .chat-product { font-size: 11px; font-weight: 800; color: var(--brand-color); text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.5px;}
        .chat-last-msg { font-size: 13px; color: var(--text-muted); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .unread-indicator { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; flex-shrink: 0; margin-left: 10px; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);}

        /* 🚀 Empty State */
        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-icon-wrap { background: #f1f5f9; width: 90px; height: 90px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px;}
        .empty-state i { font-size: 40px; color: #cbd5e1; }
        .empty-state h3 { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0 0 8px; letter-spacing: -0.5px;}
        .empty-state p { font-size: 14px; font-weight: 500; color: var(--text-muted); line-height: 1.5;}

        /* 🚀 Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { display: flex; gap: 15px; padding: 16px; background: white; border-radius: 20px; margin-bottom: 14px; border: 1px solid #f1f5f9; align-items: center;}
        .sk-avatar { width: 55px; height: 55px; border-radius: 50%; flex-shrink: 0;}
        .sk-lines { flex: 1; display: flex; flex-direction: column; justify-content: center;}
        .sk-line-1 { height: 16px; width: 50%; border-radius: 4px; margin-bottom: 8px; }
        .sk-line-2 { height: 12px; width: 30%; border-radius: 4px; margin-bottom: 8px; }
        .sk-line-3 { height: 12px; width: 85%; border-radius: 4px; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR MESSAGES INBOX     */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .header { background: rgba(15, 23, 42, 0.95) !important; border-bottom-color: #334155 !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        
        body.dark-mode .chat-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.3) !important; }
        body.dark-mode .chat-card:active { background: #334155 !important; }
        
        body.dark-mode .chat-avatar { border-color: #0f172a !important; background: #334155 !important; }
        body.dark-mode .chat-name { color: #f1f5f9 !important; }
        body.dark-mode .chat-time { color: #64748b !important; }
        
        body.dark-mode .chat-product { color: #60a5fa !important; } 
        body.dark-mode .chat-last-msg { color: #94a3b8 !important; }
        body.dark-mode .chat-last-msg.unread-text { color: #f1f5f9 !important; }

        body.dark-mode .empty-icon-wrap { background: #1e293b !important; }
        body.dark-mode .empty-state h3 { color: #f1f5f9 !important; }
        body.dark-mode .empty-state p { color: #94a3b8 !important; }
        body.dark-mode .empty-state i { color: #334155 !important; }
        
        body.dark-mode .sk-card { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>

<!-- 🚀 GATEKEEPER TAG -->
<body data-page-id="messages">
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <div class="app-container">
        
        <div class="header">
            <div class="header-top-flex">
                <h1 class="page-title">Messages</h1>
            </div>
        </div>

        <div class="content-area">
            
            <div class="inbox-container" id="skeleton-loader">
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
            </div>

            <div class="inbox-container" id="inbox-list" style="display: none;"></div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" style="color: var(--brand-color);">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="window.location.href='../add-product/index.html'"><i class="fas fa-plus"></i></div>
            <a href="../saved/index.html" class="nav-item"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="../account/index.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "../login/index.html"; return; }
            currentUser = session.user;
            
            await loadInbox();
            setupRealtimeInbox();
        });

        async function requireLogin(targetUrl) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        async function loadInbox() {
            const list = document.getElementById('inbox-list');
            const skeleton = document.getElementById('skeleton-loader');

            try {
                const { data: chats, error } = await supabaseClient
                    .from('chats')
                    .select('*')
                    .or(`customer_id.eq.${currentUser.id},vendor_id.eq.${currentUser.id}`)
                    .order('last_message_time', { ascending: false });

                if (error) throw error;

                skeleton.style.display = 'none';
                list.style.display = 'block';

                if (!chats || chats.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon-wrap"><i class="fas fa-inbox"></i></div>
                            <h3>No Messages Yet</h3>
                            <p>When you contact a vendor or a customer messages you, the chat will appear here.</p>
                        </div>
                    `;
                    return;
                }

                const productIds = [...new Set(chats.map(c => c.product_id))];
                const customerIds = [...new Set(chats.map(c => c.customer_id))];
                const vendorIds = [...new Set(chats.map(c => c.vendor_id))];

                const [prodRes, profRes, vendRes] = await Promise.all([
                    supabaseClient.from('products').select('id, name').in('id', productIds),
                    supabaseClient.from('profiles').select('id, full_name, avatar_url').in('id', customerIds),
                    supabaseClient.from('vendors').select('profile_id, business_name, logo_url').in('profile_id', vendorIds)
                ]);

                const prodDict = {}; prodRes.data?.forEach(p => prodDict[p.id] = p);
                const profDict = {}; profRes.data?.forEach(p => profDict[p.id] = p);
                const vendDict = {}; vendRes.data?.forEach(v => vendDict[v.profile_id] = v);

                list.innerHTML = "";

                chats.forEach(chat => {
                    const amICustomer = currentUser.id === chat.customer_id;
                    const productData = prodDict[chat.product_id] || { name: "Unknown Item" };
                    
                    let displayName = "";
                    let displayAvatar = "";
                    let isVerified = false;

                    if (amICustomer) {
                        const vData = vendDict[chat.vendor_id];
                        displayName = vData ? vData.business_name : "Store Vendor";
                        displayAvatar = vData && vData.logo_url ? vData.logo_url : "https://via.placeholder.com/150";
                        isVerified = true;
                    } else {
                        const cData = profDict[chat.customer_id];
                        displayName = cData ? cData.full_name : "Customer";
                        displayAvatar = cData && cData.avatar_url ? cData.avatar_url : "https://via.placeholder.com/150";
                    }

                    const timeAgo = formatChatTime(chat.last_message_time);
                    const lastMsg = chat.last_message_text || "Started a conversation";
                    
                    // 🚀 Smart Unread Status Logic
                    const isUnread = (amICustomer && chat.unread_by_customer) || (!amICustomer && chat.unread_by_vendor);
                    const unreadDotHTML = isUnread ? `<div class="unread-indicator"></div>` : ``;
                    const unreadTextClass = isUnread ? `font-weight: 800; color: var(--text-main);` : ``;

                    list.insertAdjacentHTML('beforeend', `
                        <div class="chat-card" onclick="window.location.href='../chats/index.html?chat_id=${escapeJS(chat.id)}'">
                            <img src="${escapeHTML(displayAvatar)}" class="chat-avatar" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="chat-info">
                                <div class="chat-header-row">
                                    <div class="chat-name">${escapeHTML(displayName)} ${isVerified ? '<i class="fas fa-check-circle" style="color: #38bdf8; font-size: 11px; margin-left: 3px;"></i>' : ''}</div>
                                    <div class="chat-time">${timeAgo}</div>
                                </div>
                                <div class="chat-product"><i class="fas fa-box" style="margin-right:4px;"></i>${escapeHTML(productData.name)}</div>
                                <div class="chat-last-msg" style="${unreadTextClass}">${escapeHTML(lastMsg)}</div>
                            </div>
                            ${unreadDotHTML}
                        </div>
                    `);
                });

            } catch (err) {
                console.error("Failed to load inbox:", err);
                skeleton.style.display = 'none';
                list.innerHTML = `<p style="text-align:center; color:#ef4444; font-weight: 600;">Error loading messages. Please check your connection.</p>`;
            }
        }

        function setupRealtimeInbox() {
            supabaseClient.channel('inbox-updates')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chats' }, () => {
                    loadInbox(); 
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, () => {
                    loadInbox(); 
                })
                .subscribe();
        }

        function formatChatTime(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffDays === 0 && now.getDate() === date.getDate()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diffDays === 1 || (diffDays === 0 && now.getDate() !== date.getDate())) {
                return "Yesterday";
            } else if (diffDays < 7) {
                return date.toLocaleDateString([], { weekday: 'short' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }
    </script>
</body>
</html>
