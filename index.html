    <script src="asset/script.js"></script>

    <script>
        async function checkUnreadNotifications() {
            try {
                const lastSeenStr = localStorage.getItem('last_notif_seen_time') || '2000-01-01T00:00:00.000Z';
                const { data, error } = await supabaseClient
                    .from('notifications')
                    .select('id')
                    .gt('created_at', lastSeenStr) 
                    .limit(1);

                if (!error && data && data.length > 0) {
                    document.getElementById('red-dot').style.display = 'block';
                }
            } catch(err) {
                console.log("No notifications yet.");
            }
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(checkUnreadNotifications, 1000);
        });
    </script>
