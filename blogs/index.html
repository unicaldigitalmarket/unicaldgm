<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus News | UNICAL Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">

    <style>
        :root { --brand-color: #FF7A00; }

        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .page-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0; }
        
        .search-container { background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; padding: 12px 15px; margin-bottom: 15px;}
        .search-container input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--text-main); }
        
        .chip-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .chip-scroll::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--brand-color); color: white; border-color: var(--brand-color); box-shadow: 0 4px 10px rgba(255, 122, 0, 0.2); }

        .news-card { background: white; border-radius: 20px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; transition: transform 0.2s; cursor: pointer; display: flex; flex-direction: column; }
        .news-card:active { transform: scale(0.98); }
        
        .news-cover { width: 100%; height: 180px; object-fit: cover; display: block; background: #e2e8f0; }
        .news-content { padding: 20px; }
        
        .blog-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
        .cat-badge { color: var(--brand-color); background: rgba(255, 122, 0, 0.1); padding: 4px 10px; border-radius: 8px; }
        
        .blog-title { font-size: 18px; font-weight: 900; color: var(--text-main); margin: 0 0 8px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .blog-snippet { font-size: 13px; color: #64748b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 15px; }
        
        .interaction-row { display: flex; justify-content: space-between; align-items: center; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .stats-group { display: flex; gap: 15px; }
        .stat-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: 12px; font-weight: 700; }
        .stat-item i { font-size: 14px; color: #94a3b8; }
        .read-btn { color: var(--brand-color); font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 5px; }

        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* 🌙 DARK MODE FIXES FOR CAMPUS NEWS */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; }
        body.dark-mode .page-title, body.dark-mode .back-btn { color: #f1f5f9 !important; }
        body.dark-mode .search-container { background: #1e293b !important; border: 1px solid #334155 !important; box-shadow: none !important; }
        body.dark-mode .search-container input { color: #f1f5f9 !important; }
        body.dark-mode .chip { background: #1e293b !important; border-color: #334155 !important; color: #94a3b8 !important; }
        body.dark-mode .chip.active { background: var(--brand-color) !important; color: white !important; border-color: var(--brand-color) !important; }
        body.dark-mode .news-card { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .blog-title { color: #f1f5f9 !important; }
        body.dark-mode .blog-snippet { color: #cbd5e1 !important; }
        body.dark-mode .interaction-row { border-top-color: #334155 !important; }
        body.dark-mode .stat-item { color: #94a3b8 !important; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header" style="background: transparent; border: none; padding-bottom: 5px;">
            <div class="header-top-flex">
                <a href="../index.html" class="back-btn" style="color: var(--text-main); font-size: 20px;"><i class="fas fa-arrow-left"></i></a>
                <h1 class="page-title">Campus News</h1>
            </div>
            <div class="search-container">
                <i class="fas fa-search" style="color: #94a3b8; margin-right: 10px;"></i>
                <input type="text" id="blog-search" placeholder="Search gossips, news..." oninput="filterBlogs()">
            </div>
        </div>

        <div class="content-area" style="padding: 0 20px 90px;">
            
            <div class="chip-scroll">
                <div class="chip active" onclick="setCategory('All', this)">All News</div>
                <div class="chip" onclick="setCategory('News', this)">News</div>
                <div class="chip" onclick="setCategory('Academics', this)">Academics</div>
                <div class="chip" onclick="setCategory('Gossip', this)">Gossip</div>
                <div class="chip" onclick="setCategory('Events', this)">Events</div>
            </div>

            <div id="blog-list" style="margin-top: 15px;">
                <div class="news-card"><div class="sk-shimmer" style="height: 180px;"></div><div class="news-content"><div class="sk-shimmer" style="height: 20px; width: 80%; margin-bottom: 10px;"></div><div class="sk-shimmer" style="height: 15px; width: 100%; margin-bottom: 5px;"></div><div class="sk-shimmer" style="height: 15px; width: 60%;"></div></div></div>
            </div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')"><i class="fas fa-comment-dots"></i><span class="red-dot msg-dot"></span><span>Messages</span></a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')"><i class="fas fa-user"></i><span>Account</span></a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let allBlogs = [];
        let activeCategory = 'All';

        // 🛡️ XSS Sanitizer Function
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchBlogs();
        });

        async function fetchBlogs() {
            try {
                const { data, error } = await supabaseClient
                    .from('blogs')
                    .select('id, title, snippet, category, image_url, views, likes, created_at, blog_comments(count)')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allBlogs = data;
                renderBlogs();

            } catch (error) {
                document.getElementById('blog-list').innerHTML = `<p style="color:red; text-align:center;">Failed to load news.</p>`;
            }
        }

        function renderBlogs() {
            const container = document.getElementById('blog-list');
            const query = document.getElementById('blog-search').value.toLowerCase();
            container.innerHTML = "";

            const filtered = allBlogs.filter(b => {
                const matchesSearch = b.title.toLowerCase().includes(query) || b.snippet.toLowerCase().includes(query);
                const matchesCat = activeCategory === 'All' || b.category === activeCategory;
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 40px 20px;">
                        <i class="fas fa-newspaper" style="font-size: 40px; color: var(--text-muted); margin-bottom: 15px;"></i>
                        <h3 style="color: var(--text-main); margin: 0 0 5px;">No Updates Found</h3>
                        <p style="color: var(--text-muted); font-size: 13px;">Check back later for more campus news.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(b => {
                const likeCount = b.likes ? b.likes.length : 0;
                const commentCount = (b.blog_comments && b.blog_comments.length > 0) ? b.blog_comments[0].count : 0;
                
                // Routes perfectly to the new page
                const postUrl = `../blog-content/index.html?id=${encodeURIComponent(b.id)}`;

                container.innerHTML += `
                    <div class="news-card" onclick="window.location.href='${postUrl}'">
                        <img src="${escapeHTML(b.image_url) || 'https://via.placeholder.com/600x300'}" class="news-cover" onerror="this.src='https://via.placeholder.com/600x300'">
                        <div class="news-content">
                            <div class="blog-meta">
                                <span class="cat-badge">${escapeHTML(b.category || 'News')}</span>
                                <span>${new Date(b.created_at).toLocaleDateString()}</span>
                            </div>
                            <h3 class="blog-title">${escapeHTML(b.title)}</h3>
                            <div class="blog-snippet">${escapeHTML(b.snippet)}</div>
                            
                            <div class="interaction-row">
                                <div class="stats-group">
                                    <div class="stat-item"><i class="far fa-heart"></i> ${likeCount}</div>
                                    <div class="stat-item"><i class="far fa-comment"></i> ${commentCount}</div>
                                    <div class="stat-item"><i class="far fa-eye"></i> ${b.views || 0}</div>
                                </div>
                                <div class="read-btn">Read More <i class="fas fa-arrow-right"></i></div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.setCategory = function(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderBlogs();
        }

        window.filterBlogs = function() { renderBlogs(); }
    </script>
</body>
</html>
