<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus News | UNICAL Digital Market</title>
    
    <!-- 🚀 PRIMARY SEO -->
    <meta name="description" content="Stay updated with the latest campus news, student gist, events, and market announcements on UNICAL Digital Market. Your #1 source for University of Calabar updates.">
    <meta name="keywords" content="UNICAL news, campus gist Calabar, UNICAL student blog, UnicalDGM announcements, University of Calabar events">
    <meta name="author" content="UnicalDGM">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://unicaldgm.com.ng/blogs/">

    <!-- 🚀 SOCIAL MEDIA & WHATSAPP PREVIEWS -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://unicaldgm.com.ng/blogs/">
    <meta property="og:title" content="Campus News & Gist | UNICAL Digital Market">
    <meta property="og:description" content="Get the latest updates, events, and campus news from the University of Calabar.">
    <meta property="og:image" content="https://unicaldgm.com.ng/512.png">

    <!-- 🚀 MOBILE APP & ICONS -->
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root { 
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --brand-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            background: var(--brand-bg); width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative; z-index: 1;
        }
        
        /* 🚀 Glassmorphic Header */
        .blog-header-wrapper {
            position: sticky; top: 0; z-index: 100;
            background: rgba(248, 250, 252, 0.9); 
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 15px 20px 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .back-btn { background: white; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .back-btn:active { transform: scale(0.9); background: #f1f5f9; }
        .page-title { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -0.5px;}
        
        /* 🚀 Premium Search Bar */
        .search-container { background: #f1f5f9; border-radius: 16px; display: flex; align-items: center; padding: 14px 18px; border: 2px solid transparent; transition: 0.2s;}
        .search-container:focus-within { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.1); }
        .search-container input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--text-main); font-family: inherit; font-weight: 500;}
        .search-container input::placeholder { color: #94a3b8; }

        .content-area { padding: 0 20px 90px; }
        
        /* 🚀 Filter Chips */
        .chip-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; margin-top: 15px; }
        .chip-scroll::-webkit-scrollbar { display: none; }
        .chip { padding: 10px 18px; background: white; border: 1px solid #e2e8f0; border-radius: 24px; font-size: 13px; font-weight: 700; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.01);}
        .chip.active { background: var(--brand-gradient); color: white; border-color: transparent; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3); }

        /* 🚀 Modern News Cards */
        .news-card { 
            background: white; border-radius: 20px; margin-bottom: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.03); 
            border: 1px solid #e2e8f0; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; 
            display: flex; gap: 15px; padding: 15px; align-items: center;
        }
        .news-card:active { transform: scale(0.98); background: #f8fafc; }
        
        .news-cover { 
            width: 100px; height: 100px; border-radius: 14px; object-fit: cover; 
            background: #f1f5f9; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .news-content { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        
        .blog-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .cat-badge { color: var(--brand-color); background: rgba(255, 122, 0, 0.1); padding: 5px 10px; border-radius: 8px; letter-spacing: 0.5px;}
        
        .blog-title { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; letter-spacing: -0.3px;}
        .blog-snippet { font-size: 13px; color: var(--text-muted); font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 10px;}
        
        .interaction-row { display: flex; justify-content: space-between; align-items: center; }
        .stats-group { display: flex; gap: 15px; }
        .stat-item { display: flex; align-items: center; gap: 5px; color: #94a3b8; font-size: 12px; font-weight: 700; }
        .stat-item i { font-size: 13px; transition: 0.2s; }
        .liked { color: #ef4444 !important; animation: pop 0.3s ease;}
        @keyframes pop { 50% { transform: scale(1.3); } }
        
        .share-btn { 
            color: #64748b; background: #f1f5f9; width: 30px; height: 30px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 12px; transition: 0.2s;
        }
        .share-btn:active { transform: scale(0.9); background: #e2e8f0; }

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-news-cover { width: 100px; height: 100px; border-radius: 14px; flex-shrink: 0; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR CAMPUS NEWS        */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .blog-header-wrapper { background: rgba(15, 23, 42, 0.95) !important; border-bottom-color: #334155 !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        body.dark-mode .back-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important;}
        body.dark-mode .back-btn:active { background: #334155 !important; }
        
        body.dark-mode .search-container { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .search-container input { color: #f1f5f9 !important; }
        body.dark-mode .search-container:focus-within { border-color: var(--brand-color) !important; }
        
        body.dark-mode .chip { background: #1e293b !important; border-color: #334155 !important; color: #94a3b8 !important; }
        body.dark-mode .chip.active { background: var(--brand-gradient) !important; color: white !important; border-color: transparent !important; }
        
        body.dark-mode .news-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 8px 25px rgba(0,0,0,0.5) !important;}
        body.dark-mode .news-card:active { background: #334155 !important; }
        body.dark-mode .news-cover { background: #0f172a !important; box-shadow: none !important;}
        body.dark-mode .blog-title { color: #f1f5f9 !important; }
        body.dark-mode .blog-snippet { color: #cbd5e1 !important; }
        body.dark-mode .cat-badge { background: rgba(255, 122, 0, 0.15) !important; }
        
        body.dark-mode .share-btn { background: #334155 !important; color: #cbd5e1 !important; }
        body.dark-mode .share-btn:active { background: #475569 !important; }
        
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <div class="app-container">
        
        <div class="blog-header-wrapper">
            <div class="header-top-flex">
                <!-- 🚀 SMART BACK BUTTON -->
                <button class="back-btn" onclick="smartBack(event)"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Campus News</h1>
            </div>
            <div class="search-container">
                <i class="fas fa-search" style="color: #94a3b8; margin-right: 10px; font-size: 16px;"></i>
                <input type="text" id="blog-search" placeholder="Search gossips, news, events..." oninput="filterBlogs()">
            </div>
        </div>

        <div class="content-area">
            
            <div class="chip-scroll">
                <div class="chip active" onclick="setCategory('All', this)">All News</div>
                <div class="chip" onclick="setCategory('News', this)">News</div>
                <div class="chip" onclick="setCategory('Academics', this)">Academics</div>
                <div class="chip" onclick="setCategory('Gossip', this)">Gossip</div>
                <div class="chip" onclick="setCategory('Events', this)">Events</div>
            </div>

            <div id="blog-list" style="margin-top: 20px;">
                <!-- Skeletons -->
                <div class="news-card" style="cursor: default;">
                    <div class="sk-shimmer sk-news-cover"></div>
                    <div class="news-content" style="padding: 0;">
                        <div style="display:flex; justify-content:space-between; margin-bottom: 12px;">
                            <div class="sk-shimmer" style="width: 55px; height: 18px; border-radius: 8px;"></div>
                            <div class="sk-shimmer" style="width: 60px; height: 12px;"></div>
                        </div>
                        <div class="sk-shimmer" style="width: 100%; height: 18px; margin-bottom: 8px;"></div>
                        <div class="sk-shimmer" style="width: 75%; height: 18px; margin-bottom: 12px;"></div>
                        <div class="sk-shimmer" style="width: 90%; height: 14px; margin-bottom: 15px;"></div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="sk-shimmer" style="width: 110px; height: 14px;"></div>
                            <div class="sk-shimmer" style="width: 30px; height: 30px; border-radius: 50%;"></div>
                        </div>
                    </div>
                </div>

                <div class="news-card" style="cursor: default;">
                    <div class="sk-shimmer sk-news-cover"></div>
                    <div class="news-content" style="padding: 0;">
                        <div style="display:flex; justify-content:space-between; margin-bottom: 12px;">
                            <div class="sk-shimmer" style="width: 65px; height: 18px; border-radius: 8px;"></div>
                            <div class="sk-shimmer" style="width: 50px; height: 12px;"></div>
                        </div>
                        <div class="sk-shimmer" style="width: 90%; height: 18px; margin-bottom: 8px;"></div>
                        <div class="sk-shimmer" style="width: 60%; height: 18px; margin-bottom: 12px;"></div>
                        <div class="sk-shimmer" style="width: 95%; height: 14px; margin-bottom: 15px;"></div>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="sk-shimmer" style="width: 90px; height: 14px;"></div>
                            <div class="sk-shimmer" style="width: 30px; height: 30px; border-radius: 50%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="../" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/')">
                <i class="fas fa-comment-dots"></i><span class="red-dot msg-dot"></span><span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/')"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/')"><i class="fas fa-user"></i><span>Account</span></a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;
        let allBlogs = [];
        let activeCategory = 'All';

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;
            
            fetchBlogs();
        });

        async function requireLogin(targetUrl) {
            if (currentUser) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        async function fetchBlogs() {
            try {
                const { data, error } = await supabaseClient
                    .from('blogs')
                    .select('id, title, snippet, category, image_url, views, likes, created_at, blog_comments(count)')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allBlogs = data;
                renderBlogs();

            } catch (error) {
                console.error(error);
                document.getElementById('blog-list').innerHTML = `<p style="color:#ef4444; text-align:center; font-weight:600; padding: 20px;">Failed to load news. Check your connection.</p>`;
            }
        }

        function renderBlogs() {
            const container = document.getElementById('blog-list');
            const query = document.getElementById('blog-search').value.toLowerCase();
            
            container.innerHTML = "";

            const filtered = allBlogs.filter(b => {
                const matchesSearch = b.title.toLowerCase().includes(query) || (b.snippet && b.snippet.toLowerCase().includes(query));
                const matchesCat = activeCategory === 'All' || b.category === activeCategory;
                return matchesSearch && matchesCat;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 60px 20px;">
                        <div style="background: #f1f5f9; width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 15px;">
                            <i class="fas fa-newspaper" style="font-size:35px; color:#cbd5e1;"></i>
                        </div>
                        <h3 style="color:var(--text-main); margin:0 0 8px; font-size: 18px; font-weight: 800;">No news found</h3>
                        <p style="color:var(--text-muted); font-size:14px; font-weight: 500;">Try selecting a different category or adjusting your search terms.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(b => {
                const isLiked = currentUser && b.likes && b.likes.includes(currentUser.id);
                const likeClass = isLiked ? 'fas fa-heart liked' : 'far fa-heart';
                const likeCount = b.likes ? b.likes.length : 0;
                const commentCount = (b.blog_comments && b.blog_comments.length > 0) ? b.blog_comments[0].count : 0;
                
                const safeTitle = escapeHTML(b.title);
                const safeSnippet = escapeHTML(b.snippet || '');
                const safeCat = escapeHTML(b.category || 'News');
                
                const dateObj = new Date(b.created_at);
                const shortDate = `${dateObj.toLocaleString('en-US', { month: 'short' })} ${dateObj.getDate()}`;

                container.insertAdjacentHTML('beforeend', `
                    <div class="news-card" onclick="window.location.href='../blog-content/index.html?id=${escapeJS(b.id)}'">
                        <img src="${escapeHTML(b.image_url) || 'https://via.placeholder.com/150'}" class="news-cover" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="news-content">
                            <div class="blog-meta">
                                <span class="cat-badge">${safeCat}</span>
                                <span class="blog-date">${shortDate}</span>
                            </div>
                            <h3 class="blog-title">${safeTitle}</h3>
                            <div class="blog-snippet">${safeSnippet}</div>
                            
                            <div class="interaction-row">
                                <div class="stats-group">
                                    <div class="stat-item" onclick="event.stopPropagation(); toggleLike('${escapeJS(b.id)}')">
                                        <i class="${likeClass}"></i> ${likeCount}
                                    </div>
                                    <div class="stat-item"><i class="far fa-comment"></i> ${commentCount}</div>
                                    <div class="stat-item"><i class="far fa-eye"></i> ${b.views || 0}</div>
                                </div>
                                <div class="share-btn" onclick="event.stopPropagation(); shareBlog('${escapeJS(b.id)}', '${escapeJS(b.title)}', '${escapeJS(b.snippet)}')"><i class="fas fa-share-alt"></i></div>
                            </div>
                        </div>
                    </div>
                `);
            });
        }

        window.setCategory = function(cat, btn) {
            activeCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderBlogs();
        }

        window.filterBlogs = function() { renderBlogs(); }

        window.toggleLike = async function(blogId) {
            if (!currentUser) {
                alert("Please log in to like posts.");
                window.location.href = "../login/index.html";
                return;
            }

            const b = allBlogs.find(x => x.id === blogId);
            let currentLikes = b.likes || [];
            
            if (currentLikes.includes(currentUser.id)) currentLikes = currentLikes.filter(id => id !== currentUser.id);
            else currentLikes.push(currentUser.id);

            b.likes = currentLikes; renderBlogs();
            try { await supabaseClient.from('blogs').update({ likes: currentLikes }).eq('id', blogId); } 
            catch (error) { console.error("Like failed to sync."); }
        }

        function createSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        }

        window.shareBlog = function(blogId, title, snippet) {
            const slug = createSlug(title);
            const url = `${window.location.origin}/blog-content/index.html?id=${blogId}&post=${slug}`;
            const safeSnippet = snippet ? snippet : 'Read the latest update on UNICAL Digital Market.';
            
            const shareText = `*${title}*\n\n${safeSnippet}\n\nRead the full article on UNICAL Digital Market:\n${url}`;

            if (navigator.share) {
                navigator.share({
                    title: "UNICAL Market News",
                    text: `*${title}*\n${safeSnippet}\n\nRead the full article on UNICAL Digital Market:`,
                    url: url
                }).catch(err => console.log('Share cancelled', err));
            } else {
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
                window.open(waUrl, '_blank');
            }
        }
    </script>
</body>
</html>
