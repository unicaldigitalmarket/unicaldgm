<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Campus News | UNICAL Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">

    <style>
        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .page-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0; }
        
        .search-container { background: white; border-radius: 12px; display: flex; align-items: center; padding: 12px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); margin-bottom: 15px;}
        .search-container input { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; color: var(--text-main); }
        
        /* Category Chips */
        .chip-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .chip-scroll::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 16px; background: white; border: 1px solid #e2e8f0; border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .chip.active { background: var(--brand-color); color: white; border-color: var(--brand-color); }

        /* 🚀 THE FIX: Renamed from blog-card to news-card to avoid CSS conflicts */
        .news-card { background: white; border-radius: 16px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; transition: transform 0.2s; cursor: pointer; display: block; }
        .news-card:active { transform: scale(0.98); }
        .news-cover { width: 100%; height: 180px; object-fit: cover; display: block; background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
        .news-content { padding: 15px; }
        
        .blog-meta { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .cat-badge { color: #2d8eff; background: #eff6ff; padding: 3px 8px; border-radius: 6px; }
        .blog-title { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; line-height: 1.3; }
        .blog-snippet { font-size: 13px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Interaction Row */
        .interaction-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid #f1f5f9; }
        .stats-group { display: flex; gap: 15px; }
        .stat-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: 12px; font-weight: 600; }
        .stat-item i { font-size: 14px; }
        .liked { color: #ef4444 !important; }
        .share-btn { color: #2d8eff; background: #eff6ff; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }

        /* 🚀 THE READING MODAL */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: flex-end; }
        .modal-content { background: white; width: 100%; max-width: 480px; height: 90vh; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; position: relative; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; font-size: 18px; backdrop-filter: blur(4px); }
        .modal-scroll-area { overflow-y: auto; flex: 1; padding-bottom: 80px; }
        .modal-hero { width: 100%; height: 220px; object-fit: cover; }
        .modal-body { padding: 20px; }
        .modal-title { font-size: 22px; font-weight: 800; color: var(--text-main); margin: 10px 0 15px; line-height: 1.3; }
        .modal-text { font-size: 15px; color: #334155; line-height: 1.7; white-space: pre-wrap; }

        /* Comments Section */
        .comments-section { margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .comment-card { display: flex; gap: 12px; margin-bottom: 15px; }
        .comment-avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; background: #eee; }
        .comment-bubble { background: #f8fafc; padding: 12px 15px; border-radius: 0 15px 15px 15px; flex: 1; border: 1px solid #f1f5f9; }
        .comment-name { font-size: 12px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; }
        .comment-text { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        .comment-input-area { position: absolute; bottom: 0; left: 0; width: 100%; background: white; padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); display: flex; gap: 10px; border-top: 1px solid #e2e8f0; }
        .comment-input { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid #e2e8f0; background: #f8fafc; outline: none; font-size: 13px; }
        .comment-input:focus { border-color: var(--brand-color); }
        .send-btn { background: var(--brand-color); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="header" style="background: transparent; border: none; padding-bottom: 5px;">
            <div class="header-top-flex">
                <a href="../index.html" class="back-btn" style="color: var(--text-main); font-size: 20px;"><i class="fas fa-arrow-left"></i></a>
                <h1 class="page-title">Campus News</h1>
            </div>
            <div class="search-container">
                <i class="fas fa-search" style="color: #94a3b8; margin-right: 10px;"></i>
                <input type="text" id="blog-search" placeholder="Search gossips, news..." oninput="filterBlogs()">
            </div>
        </div>

        <div class="content-area" style="padding: 0 20px 90px;">
            
            <div class="chip-scroll">
                <div class="chip active" onclick="setCategory('All', this)">All News</div>
                <div class="chip" onclick="setCategory('News', this)">News</div>
                <div class="chip" onclick="setCategory('Academics', this)">Academics</div>
                <div class="chip" onclick="setCategory('Gossip', this)">Gossip</div>
                <div class="chip" onclick="setCategory('Events', this)">Events</div>
            </div>

            <div id="blog-list" style="margin-top: 15px;">
                <p style="text-align:center; color:#94a3b8;"><i class="fas fa-spinner fa-spin"></i> Loading latest updates...</p>
            </div>

        </div>

        <div id="blogModal" class="modal-overlay" onclick="closeBlogModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <div class="modal-close" onclick="closeBlogModal()"><i class="fas fa-times"></i></div>
                
                <div class="modal-scroll-area" id="modal-scroll">
                    <img src="" id="modalImg" class="modal-hero" onerror="this.src='https://via.placeholder.com/600x300'">
                    <div class="modal-body">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="cat-badge" id="modalCat">News</span>
                            <span style="font-size:12px; color:#94a3b8; font-weight:600;" id="modalDate"></span>
                        </div>
                        <h2 class="modal-title" id="modalTitle"></h2>
                        <div class="modal-text" id="modalText"></div>

                        <div class="comments-section">
                            <h4 style="margin:0 0 15px; color:#0f172a; font-size:16px;">Comments</h4>
                            <div id="commentsList">
                                </div>
                        </div>
                    </div>
                </div>

                <div class="comment-input-area">
                    <input type="text" id="commentInput" class="comment-input" placeholder="Type a comment...">
                    <button class="send-btn" onclick="postComment()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item">
                <i class="fas fa-home"></i><span>Home</span>
            </a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i><span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')">
                <i class="fas fa-plus"></i>
            </div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')">
                <i class="fas fa-heart"></i><span>Saved</span>
            </a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')">
                <i class="fas fa-user"></i><span>Account</span>
            </a>
        </div>

    </div>

   <script>
    const SUPABASE_URL = 'https://tqukdcajpkhbunsxovjf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRxdWtkY2FqcGtoYnVuc3hvdmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MzgyNDcsImV4cCI6MjA5MDIxNDI0N30.0a4luZi00muORofzbrg5eWgvZSU28ghQ2yYcBU-XL3I';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let allBlogs = [];
    let activeCategory = 'All';
    let currentOpenBlogId = null;

    document.addEventListener("DOMContentLoaded", async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) currentUser = session.user;
        fetchBlogs();
    });

    async function requireLogin(targetUrl) {
        if (currentUser) window.location.href = targetUrl;
        else window.location.href = "../login/index.html";
    }

    // Helper: Make Title SEO Friendly (e.g. "UNICAL Market!" -> "unical-market")
    function createSlug(title) {
        return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
    }

    // --- FETCH BLOGS & AUTO-OPEN DEEP LINKS ---
    async function fetchBlogs() {
        try {
            const { data, error } = await supabaseClient
                .from('blogs')
                .select('id, title, snippet, content, category, image_url, views, likes, created_at, blog_comments(count)')
                .order('created_at', { ascending: false });

            if (error) throw error;
            allBlogs = data;
            renderBlogs();

            // 🚀 DEEP LINK CHECK: Did they click a WhatsApp link?
            const urlParams = new URLSearchParams(window.location.search);
            const postParam = urlParams.get('post');
            
            if (postParam) {
                // Extract the ID from the end of the slug (e.g., "my-title--ID")
                const exactId = postParam.includes('--') ? postParam.split('--').pop() : postParam;
                const targetBlog = allBlogs.find(b => b.id === exactId);
                
                if (targetBlog) {
                    openBlogModal(targetBlog.id, true); // True = prevents URL duplicate pushing
                }
            }

        } catch (error) {
            console.error(error);
            document.getElementById('blog-list').innerHTML = `<p style="color:red; text-align:center;">Failed to load news.</p>`;
        }
    }

    function renderBlogs() {
        const container = document.getElementById('blog-list');
        const query = document.getElementById('blog-search').value.toLowerCase();
        container.innerHTML = "";

        const filtered = allBlogs.filter(b => {
            const matchesSearch = b.title.toLowerCase().includes(query) || b.snippet.toLowerCase().includes(query);
            const matchesCat = activeCategory === 'All' || b.category === activeCategory;
            return matchesSearch && matchesCat;
        });

        if (filtered.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:40px;">No updates found.</p>`;
            return;
        }

        filtered.forEach(b => {
            const isLiked = currentUser && b.likes && b.likes.includes(currentUser.id);
            const likeClass = isLiked ? 'fas fa-heart liked' : 'far fa-heart';
            const likeCount = b.likes ? b.likes.length : 0;
            const commentCount = (b.blog_comments && b.blog_comments.length > 0) ? b.blog_comments[0].count : 0;
            
            // Clean up text for the share function so quotes don't break the code
            const safeTitle = b.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            const safeSnippet = b.snippet.replace(/'/g, "\\'").replace(/"/g, '&quot;');

            container.innerHTML += `
                <div class="news-card" onclick="openBlogModal('${b.id}')">
                    <img src="${b.image_url || 'https://via.placeholder.com/600x300'}" class="news-cover" onerror="this.src='https://via.placeholder.com/600x300'">
                    <div class="news-content">
                        <div class="blog-meta">
                            <span class="cat-badge">${b.category || 'News'}</span>
                            <span>${new Date(b.created_at).toLocaleDateString()}</span>
                        </div>
                        <h3 class="blog-title">${b.title}</h3>
                        <div class="blog-snippet">${b.snippet}</div>
                        
                        <div class="interaction-row">
                            <div class="stats-group">
                                <div class="stat-item" onclick="event.stopPropagation(); toggleLike('${b.id}')">
                                    <i class="${likeClass}"></i> ${likeCount}
                                </div>
                                <div class="stat-item"><i class="far fa-comment"></i> ${commentCount}</div>
                                <div class="stat-item"><i class="far fa-eye"></i> ${b.views || 0}</div>
                            </div>
                            <div class="share-btn" onclick="event.stopPropagation(); shareBlog('${b.id}', '${safeTitle}', '${safeSnippet}')"><i class="fas fa-share-alt"></i></div>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    window.setCategory = function(cat, btn) {
        activeCategory = cat;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        renderBlogs();
    }

    window.filterBlogs = function() { renderBlogs(); }

    // --- MODAL & FULL READING LOGIC ---
    window.openBlogModal = async function(blogId, isInitialLoad = false) {
        const b = allBlogs.find(x => x.id === blogId);
        if (!b) return;

        currentOpenBlogId = blogId;
        document.getElementById('modalImg').src = b.image_url || 'https://via.placeholder.com/600x300';
        document.getElementById('modalCat').innerText = b.category || 'News';
        document.getElementById('modalDate').innerText = new Date(b.created_at).toLocaleDateString();
        document.getElementById('modalTitle').innerText = b.title;
        
        // Converts newlines to actual paragraph breaks
        document.getElementById('modalText').innerHTML = b.content.replace(/\n/g, '<br>');

        document.getElementById('blogModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';

        // 🚀 UPDATE THE URL SO THEY CAN COPY IT DIRECTLY
        if (!isInitialLoad) {
            const slug = createSlug(b.title);
            const newUrl = `${window.location.pathname}?post=${slug}--${b.id}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }

        // Log View in database!
        const viewed = JSON.parse(localStorage.getItem('viewed_blogs') || '[]');
        if (!viewed.includes(blogId)) {
            viewed.push(blogId);
            localStorage.setItem('viewed_blogs', JSON.stringify(viewed));
            b.views = (b.views || 0) + 1; 
            renderBlogs(); 
            await supabaseClient.from('blogs').update({ views: b.views }).eq('id', blogId);
        }

        loadComments(blogId);
    }

    window.closeBlogModal = function(e) {
        if (e && e.target.id !== 'blogModal' && e.type === 'click') return;
        document.getElementById('blogModal').style.display = 'none';
        document.body.style.overflow = 'auto';
        currentOpenBlogId = null;

        // 🚀 RESET URL WHEN CLOSING MODAL
        window.history.pushState({}, '', window.location.pathname);
    }

    // --- RELATIONAL COMMENTS ---
    async function loadComments(blogId) {
        const list = document.getElementById('commentsList');
        list.innerHTML = '<p style="font-size:12px; color:#94a3b8;"><i class="fas fa-spinner fa-spin"></i> Loading comments...</p>';

        try {
            const { data, error } = await supabaseClient
                .from('blog_comments')
                .select('comment_text, created_at, profiles(full_name, avatar_url)')
                .eq('blog_id', blogId)
                .order('created_at', { ascending: true });

            if (error) throw error;
            list.innerHTML = "";

            if (data.length === 0) {
                list.innerHTML = '<p style="font-size:12px; color:#94a3b8;">Be the first to comment!</p>';
                return;
            }

            data.forEach(c => {
                const name = c.profiles?.full_name || "Student";
                const avatar = c.profiles?.avatar_url || "../img/person.png";
                list.innerHTML += `
                    <div class="comment-card">
                        <img src="${avatar}" class="comment-avatar" onerror="this.src='../img/person.png'">
                        <div class="comment-bubble">
                            <div class="comment-name">${name}</div>
                            <div class="comment-text">${c.comment_text}</div>
                        </div>
                    </div>
                `;
            });
            
            setTimeout(() => {
                const scrollArea = document.getElementById('modal-scroll');
                scrollArea.scrollTop = scrollArea.scrollHeight;
            }, 100);

        } catch (error) { list.innerHTML = '<p style="color:red; font-size:12px;">Failed to load comments.</p>'; }
    }

    window.postComment = async function() {
        if (!currentUser) {
            alert("Please log in to comment.");
            window.location.href = "../login/index.html";
            return;
        }
        
        const input = document.getElementById('commentInput');
        const text = input.value.trim();
        if (!text || !currentOpenBlogId) return;

        input.value = "Posting..."; input.disabled = true;

        try {
            await supabaseClient.from('blog_comments').insert([{ blog_id: currentOpenBlogId, user_id: currentUser.id, comment_text: text }]);
            const b = allBlogs.find(x => x.id === currentOpenBlogId);
            if(b.blog_comments && b.blog_comments.length > 0) b.blog_comments[0].count++;
            else b.blog_comments = [{count: 1}];
            renderBlogs();
            input.value = ""; loadComments(currentOpenBlogId); 
        } catch (error) {
            alert("Failed to post comment."); input.value = text; 
        } finally { input.disabled = false; }
    }

    // --- LIKES LOGIC ---
    window.toggleLike = async function(blogId) {
        if (!currentUser) {
            alert("Please log in to like posts.");
            window.location.href = "../login/index.html";
            return;
        }

        const b = allBlogs.find(x => x.id === blogId);
        let currentLikes = b.likes || [];
        
        if (currentLikes.includes(currentUser.id)) currentLikes = currentLikes.filter(id => id !== currentUser.id);
        else currentLikes.push(currentUser.id);

        b.likes = currentLikes; renderBlogs();
        try { await supabaseClient.from('blogs').update({ likes: currentLikes }).eq('id', blogId); } 
        catch (error) { console.error("Like failed to sync."); }
    }

    // 🚀 THE ULTIMATE VIRAL WHATSAPP SHARE LOGIC
    window.shareBlog = function(blogId, title, snippet) {
        const slug = createSlug(title);
        // Builds the beautiful link: unicaldgm.com/blogs/?post=unical-market--ID
        const url = `${window.location.origin}${window.location.pathname}?post=${slug}--${blogId}`;
        
        // This formats exactly how it will look in WhatsApp
        const shareText = `*${title}*\n\n${snippet}\n\nVisit UNICAL Digital Market to read the full content:\n${url}`;

        // If on mobile, it opens the native phone sharing menu!
        if (navigator.share) {
            navigator.share({
                title: "UNICAL Market News",
                text: `*${title}*\n${snippet}\n\nVisit UNICAL Digital Market to read the full content:`,
                url: url
            }).catch(err => console.log('Share cancelled', err));
        } else {
            // If on a laptop, it forces WhatsApp Web to open!
            const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
            window.open(waUrl, '_blank');
        }
    }
</script>
</body>
</html>
