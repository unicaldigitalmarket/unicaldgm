<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Page Not Found | UNICAL Market</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        :root {
            --brand-color: #FF7A00;
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            padding: 40px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            border: 1px solid #f1f5f9;
        }

        .error-icon {
            font-size: 60px;
            color: var(--brand-color);
            margin-bottom: 20px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 { font-size: 28px; font-weight: 900; margin-bottom: 10px; }
        p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }

        .redirect-text { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 20px; }
        .countdown { color: var(--brand-color); font-weight: 900; font-size: 16px; }

        .home-btn {
            display: inline-flex; justify-content: center; align-items: center; gap: 8px;
            background: var(--brand-color); color: white;
            text-decoration: none; padding: 14px 24px;
            border-radius: 14px; font-weight: 800; font-size: 15px;
            width: 100%; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 122, 0, 0.3);
        }
        .home-btn:active { transform: scale(0.96); }

        /* 🌙 DARK MODE SUPPORT */
        body.dark-mode { --bg-color: #020617; --text-main: #f1f5f9; --text-muted: #94a3b8; }
        body.dark-mode .error-container { background: #0f172a; border-color: #1e293b; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        body.dark-mode .redirect-text { color: #cbd5e1; }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="error-container">
        <i class="fas fa-search-location error-icon"></i>
        <h1>Oops! Page Lost.</h1>
        <p>We couldn't find the page you were looking for. It might have been moved, deleted, or never existed.</p>
        
        <div class="redirect-text">
            Redirecting to the market in <span class="countdown" id="timer">5</span> seconds...
        </div>

        <a href="/" class="home-btn"><i class="fas fa-home"></i> Go to Homepage Now</a>
    </div>

    <script>
        let timeLeft = 5;
        const timerElement = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                window.location.href = "/"; // Redirects to the root domain
            }
        }, 1000);
    </script>

</body>
</html>
