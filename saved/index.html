<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saved Items | UNICAL Digital Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root {
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --brand-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            background: var(--brand-bg); width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative; z-index: 1;
        }

        /* 🚀 Glassmorphic Header */
        .header {
            background: rgba(248, 250, 252, 0.95); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; }
        .back-btn { background: white; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .back-btn:active { transform: scale(0.9); background: #f1f5f9; }
        .page-title { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0; letter-spacing: -0.5px;}

        .content-area { padding: 0 0 90px 0; flex: 1; }
        
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }

        /* 🚀 Premium Product Card */
        .product-card { 
            background: white; border-radius: 20px; padding: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.03); cursor: pointer; 
            border: 1px solid #f1f5f9; position: relative; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        .product-card:active { transform: scale(0.97); background: #f8fafc;}
        
        .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 14px; background: #f1f5f9; margin-bottom: 12px; }
        .product-price { font-size: 16px; font-weight: 900; color: var(--brand-color); margin-bottom: 4px; }
        .product-title { font-size: 14px; font-weight: 700; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; letter-spacing: -0.3px;}
        .product-category { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; gap: 5px; }
        
        /* 🚀 Frosted Glass Unsave Button */
        .remove-btn { 
            position: absolute; top: 18px; right: 18px; background: rgba(255, 255, 255, 0.85); color: #ef4444; 
            width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 14px; border: 1px solid rgba(241, 245, 249, 0.8); 
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .remove-btn:active { transform: scale(0.85); background: #fee2e2;}

        /* 🚀 Friendly Empty State */
        .empty-state { text-align: center; padding: 80px 20px; display: none; flex-direction: column; align-items: center; grid-column: span 2;}
        .empty-icon-box { background: rgba(239, 68, 68, 0.1); width: 100px; height: 100px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 25px; }
        .empty-state i { font-size: 40px; color: #ef4444; }
        .empty-state h3 { font-size: 20px; font-weight: 900; color: var(--text-main); margin: 0 0 10px; letter-spacing: -0.5px;}
        .empty-state p { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; font-weight: 500;}
        .explore-btn { background: var(--brand-gradient); color: white; padding: 15px 30px; border-radius: 16px; font-weight: 800; font-size: 15px; text-decoration: none; box-shadow: 0 8px 25px rgba(255, 122, 0, 0.3); transition: 0.2s;}
        .explore-btn:active { transform: scale(0.95); box-shadow: 0 4px 15px rgba(255, 122, 0, 0.2); }

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { background: white; border-radius: 20px; padding: 12px; border: 1px solid #f1f5f9; }
        .sk-img { width: 100%; height: 140px; border-radius: 14px; margin-bottom: 12px; }
        .sk-line-1 { width: 60%; height: 16px; border-radius: 6px; margin-bottom: 8px; }
        .sk-line-2 { width: 90%; height: 14px; border-radius: 6px; margin-bottom: 6px; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR SAVED ITEMS        */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .header { background: rgba(15, 23, 42, 0.95) !important; border-bottom-color: #334155 !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        body.dark-mode .back-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important;}
        body.dark-mode .back-btn:active { background: #334155 !important; }
        
        body.dark-mode .empty-state h3 { color: #f1f5f9 !important; }
        body.dark-mode .empty-state p { color: #94a3b8 !important; }
        body.dark-mode .empty-icon-box { background: rgba(239, 68, 68, 0.15) !important; }
        
        body.dark-mode .product-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;}
        body.dark-mode .product-card:active { background: #334155 !important; }
        body.dark-mode .product-img { background: #0f172a !important; }
        body.dark-mode .product-title { color: #f1f5f9 !important; }
        body.dark-mode .product-category { color: #94a3b8 !important; }
        
        body.dark-mode .remove-btn { background: rgba(15, 23, 42, 0.75) !important; color: #ef4444 !important; border-color: #334155 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .remove-btn:active { background: #334155 !important; }
        
        body.dark-mode .sk-card { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<!-- 🚀 GATEKEEPER TAG -->
<body data-page-id="saved">
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <div class="app-container">
        
        <div class="header">
            <div class="header-top-flex">
                <button onclick="smartBack(event)" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Saved Items</h1>
            </div>
        </div>

        <div class="content-area">
            
            <div class="empty-state" id="empty-state">
                <div class="empty-icon-box">
                    <i class="fas fa-heart"></i>
                </div>
                <h3>No Saved Items</h3>
                <p>You haven't saved any items yet. Explore the marketplace and tap the heart icon to save things you like!</p>
                <a href="../items/index.html" class="explore-btn">Explore Marketplace</a>
            </div>

            <div class="items-grid" id="main-items-grid"></div>

            <div class="items-grid" id="skeleton-loader">
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div>
            </div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item">
                <i class="fas fa-home"></i><span>Home</span>
            </a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')">
                <i class="fas fa-plus"></i>
            </div>
            <a href="#" class="nav-item active" style="color: var(--brand-color);">
                <i class="fas fa-heart"></i><span>Saved</span>
            </a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')">
                <i class="fas fa-user"></i><span>Account</span>
            </a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;
        let savedProducts = [];

        // 🚀 SMART BACK BUTTON LOGIC
        function getSmartRedirectUrl() {
            const referrer = document.referrer;
            const currentWebsite = window.location.origin;

            if (referrer && referrer.startsWith(currentWebsite) && !referrer.includes('/login/') && !referrer.includes('/reset-password/')) {
                return referrer; 
            }
            return "../index.html"; 
        }

        window.smartBack = function(event) {
            if (event) event.preventDefault();
            window.location.href = getSmartRedirectUrl();
        }

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "../login/index.html";
                return;
            }
            currentUser = session.user;
            fetchSavedItems();
        });

        async function requireLogin(targetUrl) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        async function fetchSavedItems() {
            const grid = document.getElementById('main-items-grid');
            const skeleton = document.getElementById('skeleton-loader');
            const emptyState = document.getElementById('empty-state');
            
            try {
                const { data: savedData, error: savedError } = await supabaseClient
                    .from('saved_items')
                    .select('product_id')
                    .eq('user_id', currentUser.id);

                if (savedError) throw savedError;

                const savedIds = savedData.map(item => item.product_id);

                if (savedIds.length === 0) {
                    skeleton.style.display = 'none';
                    emptyState.style.display = 'flex';
                    return;
                }

                const { data: products, error: prodError } = await supabaseClient
                    .from('products')
                    .select('id, name, price, category, image_urls')
                    .in('id', savedIds)
                    .eq('status', 'Active');

                if (prodError) throw prodError;

                savedProducts = products;
                skeleton.style.display = 'none';

                if (savedProducts.length === 0) {
                    emptyState.style.display = 'flex';
                    return;
                }

                renderGrid();

            } catch (error) {
                console.error(error);
                skeleton.style.display = 'none';
                grid.innerHTML = `<p style="grid-column:span 2; text-align:center; color:#ef4444; font-weight: 600; padding: 40px;">Failed to load saved items.</p>`;
            }
        }

        function renderGrid() {
            const grid = document.getElementById('main-items-grid');
            grid.innerHTML = "";

            savedProducts.forEach(p => {
                const imgUrl = (p.image_urls && p.image_urls.length > 0) ? escapeHTML(p.image_urls[0]) : 'https://via.placeholder.com/300x300?text=No+Image';
                const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);
                
                // 🛡️ Apply Sanitization to outputs
                const safeName = escapeHTML(p.name);
                const safeCat = escapeHTML(p.category);
                const safeIdJS = escapeJS(p.id);

                grid.insertAdjacentHTML('beforeend', `
                    <div class="product-card" id="card-${safeIdJS}" onclick="window.location.href='../product/index.html?id=${safeIdJS}'">
                        <button class="remove-btn" onclick="removeItem('${safeIdJS}', event)"><i class="fas fa-heart"></i></button>
                        <img src="${imgUrl}" class="product-img" onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
                        <div class="product-price">${fPrice}</div>
                        <div class="product-title">${safeName}</div>
                        <div class="product-category"><i class="fas fa-tag"></i> ${safeCat}</div>
                    </div>
                `);
            });
        }

        window.removeItem = async function(productId, event) {
            event.stopPropagation(); 
            
            const card = document.getElementById(`card-${productId}`);
            card.style.transform = 'scale(0.8)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                card.remove();
                savedProducts = savedProducts.filter(p => p.id !== productId);
                if (savedProducts.length === 0) {
                    document.getElementById('empty-state').style.display = 'flex';
                }
            }, 300);

            try {
                await supabaseClient
                    .from('saved_items')
                    .delete()
                    .match({ user_id: currentUser.id, product_id: productId });
            } catch (err) {
                console.error("Failed to delete from database:", err);
            }
        }
    </script>
</body>
</html>
