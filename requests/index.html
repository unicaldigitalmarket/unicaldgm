<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="0; url=../coming-soon/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buyer Requests | UNICAL Digital Market</title>
    
    <!-- 🚀 PRIMARY SEO -->
    <meta name="description" content="Looking for something specific? Post a buyer request on UNICAL Digital Market and have verified student vendors contact you with offers.">
    <meta name="keywords" content="UNICAL buyer request, find items Calabar, student market request, UnicalDGM">
    <meta name="author" content="UnicalDGM">
    <meta name="robots" content="index, follow">

    <!-- 🚀 MOBILE APP & ICONS -->
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root {
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --brand-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            background: var(--brand-bg); width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative; z-index: 1;
        }

        /* 🚀 Glassmorphic Header */
        .header {
            background: rgba(255, 255, 255, 0.95); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; }
        .back-btn { background: white; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .back-btn:active { transform: scale(0.9); background: #f1f5f9; }
        .page-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0; letter-spacing: -0.3px;}

        .content-area { padding: 0 0 90px 0; flex: 1; }

        /* 🚀 Premium Form Card */
        .request-box { 
            background: white; padding: 25px 20px; border-radius: 24px; border: 1px solid #f1f5f9; 
            margin: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.03); 
        }
        .request-header { 
            font-size: 16px; font-weight: 900; color: var(--text-main); 
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px; letter-spacing: -0.3px;
        }
        
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
        .form-input { 
            width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 14px; 
            font-size: 14px; font-weight: 500; outline: none; background: #f8fafc; 
            box-sizing: border-box; transition: 0.2s; color: var(--text-main); font-family: inherit;
        }
        .form-input:focus { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.1); }
        
        select.form-input { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto; }

        /* 🚀 Image Dropzone */
        .image-upload-wrapper { 
            border: 2px dashed #cbd5e1; border-radius: 16px; padding: 25px; 
            text-align: center; background: #f8fafc; cursor: pointer; 
            margin-bottom: 15px; transition: 0.2s; position: relative;
        }
        .image-upload-wrapper:hover, .image-upload-wrapper:focus-within { border-color: var(--brand-color); background: rgba(255, 122, 0, 0.02); }
        .image-preview { max-width: 100%; height: 140px; border-radius: 12px; object-fit: cover; display: none; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* 🚀 Submit Button */
        .submit-btn { 
            background: var(--brand-gradient); color: white; border: none; width: 100%; 
            padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 800; 
            cursor: pointer; transition: 0.2s; box-shadow: 0 8px 25px rgba(255, 122, 0, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .submit-btn:active { transform: scale(0.97); box-shadow: 0 4px 15px rgba(255, 122, 0, 0.2);}
        .submit-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; color: #94a3b8; }

        .status-card { background: #fef2f2; border: 1px solid #fecaca; color: #ef4444; padding: 14px; border-radius: 14px; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none; line-height: 1.5; }

        /* 🚀 Active Requests List */
        .my-list-title { margin: 35px 20px 15px; font-size: 16px; font-weight: 900; color: var(--text-main); letter-spacing: -0.3px;}
        
        .req-card { 
            background: white; margin: 0 20px 15px; padding: 18px; border-radius: 20px; 
            border: 1px solid #f1f5f9; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .req-title { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
        .req-meta { font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 8px; display: flex; align-items: center; gap: 6px;}
        .req-budget { font-size: 14px; font-weight: 900; color: #10b981; }
        
        .del-btn { 
            background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; padding: 10px 15px; 
            border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: center; gap: 6px;
        }
        .del-btn:active { transform: scale(0.9); }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR REQUESTS PAGE      */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .header { background: rgba(15, 23, 42, 0.95) !important; border-bottom-color: #334155 !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        body.dark-mode .back-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important;}
        body.dark-mode .back-btn:active { background: #334155 !important; }
        
        body.dark-mode .request-box { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; }
        body.dark-mode .request-header { color: #f1f5f9 !important; }
        
        body.dark-mode .form-label { color: #cbd5e1 !important; }
        body.dark-mode .form-input { background: #0f172a !important; color: #f1f5f9 !important; border-color: #334155 !important; }
        body.dark-mode .form-input:focus { border-color: var(--brand-color) !important; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.15) !important;}
        
        body.dark-mode .image-upload-wrapper { background: #0f172a !important; border-color: #334155 !important; }
        body.dark-mode .image-upload-wrapper:hover, body.dark-mode .image-upload-wrapper:focus-within { border-color: var(--brand-color) !important; background: rgba(255, 122, 0, 0.1) !important; }
        body.dark-mode .image-upload-wrapper div { color: #94a3b8 !important; }
        
        body.dark-mode .submit-btn:disabled { background: #334155 !important; color: #64748b !important; box-shadow: none !important;}
        
        body.dark-mode .status-card { background: rgba(239, 68, 68, 0.1) !important; border-color: #ef4444 !important; color: #fca5a5 !important; }
        
        body.dark-mode .my-list-title { color: #f1f5f9 !important; }
        
        body.dark-mode .req-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 8px 25px rgba(0,0,0,0.3) !important;}
        body.dark-mode .req-title { color: #f1f5f9 !important; }
        body.dark-mode .req-meta { color: #94a3b8 !important; }
        body.dark-mode .req-budget { color: #34d399 !important; }
        
        body.dark-mode .del-btn { background: rgba(239, 68, 68, 0.1) !important; border-color: rgba(239, 68, 68, 0.3) !important; color: #fca5a5 !important; }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <div class="app-container">
        
        <div class="header">
            <div class="header-top-flex">
                <!-- 🚀 SMART BACK BUTTON -->
                <button onclick="smartBack(event)" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Buyer Requests</h1>
            </div>
        </div>

        <div class="content-area">
            
            <div class="request-box">
                <div class="request-header">
                    <div style="background: rgba(255, 122, 0, 0.1); width: 35px; height: 35px; border-radius: 10px; display: flex; justify-content: center; align-items: center;">
                        <i class="fas fa-bullhorn" style="color: var(--brand-color);"></i>
                    </div>
                    Post a Request
                </div>
                
                <div id="limit-warning" class="status-card"></div>

                <form id="requestForm" onsubmit="submitRequest(event)">
                    <div class="form-group">
                        <label class="form-label">What are you looking for?</label>
                        <input type="text" id="r-name" class="form-input" placeholder="e.g. Clean UK used iPhone X" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="r-cat" class="form-input" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Gadgets">Gadgets</option>
                            <option value="Fashion">Fashion & Clothing</option>
                            <option value="Food">Food & Pastries</option>
                            <option value="Transport">Transport & Delivery</option>
                            <option value="Beauty">Beauty & Personal Care</option>
                            <option value="Health">Health & Wellness</option>
                            <option value="CampusServices">Campus Services</option>
                            <option value="Professional">Professional Services</option>
                            <option value="Tutorials">Tutorials & Learning</option>
                            <option value="Books">Books & Materials</option>
                            <option value="Accommodation">Accommodation</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Your Budget (₦)</label>
                        <input type="number" id="r-budget" class="form-input" placeholder="e.g. 150000" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Extra Details</label>
                        <textarea id="r-desc" class="form-input" style="height: 100px; resize: none;" placeholder="Any specific color, battery health, or condition?" required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Add a Reference Image (Optional)</label>
                        <div class="image-upload-wrapper" onclick="document.getElementById('r-image').click()">
                            <i class="fas fa-camera" style="font-size: 28px; color: #94a3b8; margin-bottom: 10px;"></i>
                            <div style="font-size: 13px; color: #64748b; font-weight: 600;">Tap to upload an image</div>
                            <input type="file" id="r-image" accept="image/*" style="display: none;" onchange="previewImage(event)">
                            <img id="img-preview" class="image-preview" src="">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn"><i class="fas fa-paper-plane"></i> Broadcast to Vendors</button>
                </form>
            </div>

            <div class="my-list-title">My Active Requests</div>
            <div id="my-requests-list"></div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')"><i class="fas fa-user"></i><span>Account</span></a>
        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        const EMAILJS_PUBLIC_KEY = '3wyBJiU29t_daxKxy';
        const EMAILJS_SERVICE_ID = 'service_8t5x5xb';
        const EMAILJS_TEMPLATE_ID = 'template_b3srwob';

        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dj6yl36fq/image/upload';
        const CLOUDINARY_PRESET = 'unical_images';

        emailjs.init(EMAILJS_PUBLIC_KEY);

        let currentUser = null;
        let selectedFile = null;

        // 🚀 SMART BACK BUTTON LOGIC
        function getSmartRedirectUrl() {
            const referrer = document.referrer;
            const currentWebsite = window.location.origin;

            if (referrer && referrer.startsWith(currentWebsite) && !referrer.includes('/login/') && !referrer.includes('/reset-password/')) {
                return referrer; 
            }
            return "../index.html"; 
        }

        window.smartBack = function(event) {
            if (event) event.preventDefault();
            window.location.href = getSmartRedirectUrl();
        }

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "../login/index.html"; return; }
            currentUser = session.user;
            
            checkLimitsAndLoad();
        });

        async function requireLogin(targetUrl) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('img-preview');
                    img.src = e.target.result;
                    img.style.display = 'inline-block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_PRESET);
            
            const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
            const data = await res.json();
            return data.secure_url;
        }

        async function checkLimitsAndLoad() {
            const list = document.getElementById('my-requests-list');
            const warning = document.getElementById('limit-warning');
            const btn = document.getElementById('submitBtn');
            
            list.innerHTML = "<p style='text-align:center; font-size:13px; color:#94a3b8; font-weight: 500;'>Loading...</p>";

            try {
                const { data, error } = await supabaseClient
                    .from('requests')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const activeRequests = data.filter(r => r.status === 'Active');
                let canPostTime = true;
                let hoursLeft = 0;
                
                if (data.length > 0) {
                    const lastPostDate = new Date(data[0].created_at).getTime();
                    const now = new Date().getTime();
                    const diffHours = (now - lastPostDate) / (1000 * 60 * 60);
                    
                    if (diffHours < 24) {
                        canPostTime = false;
                        hoursLeft = Math.ceil(24 - diffHours);
                    }
                }

                if (activeRequests.length >= 2) {
                    warning.innerHTML = "<i class='fas fa-exclamation-circle' style='margin-right: 5px;'></i> You have reached the maximum limit of 2 active requests. Please delete one before posting a new one.";
                    warning.style.display = "block";
                    btn.disabled = true;
                } else if (!canPostTime) {
                    warning.innerHTML = `<i class='fas fa-clock' style='margin-right: 5px;'></i> You can only post one request every 24 hours to prevent spam. You can post again in <b>${hoursLeft} hours</b>.`;
                    warning.style.display = "block";
                    btn.disabled = true;
                } else {
                    warning.style.display = "none";
                    btn.disabled = false;
                }

                if (activeRequests.length === 0) {
                    list.innerHTML = "<p style='text-align:center; font-size:13px; color:#94a3b8; font-weight: 500; padding: 20px;'>You have no active requests.</p>";
                    return;
                }

                list.innerHTML = "";
                activeRequests.forEach(r => {
                    const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(r.budget);
                    
                    // 🛡️ Apply Sanitization
                    const safeName = escapeHTML(r.product_name);
                    const safeCat = escapeHTML(r.category);
                    const safeIdJS = escapeJS(r.id);

                    list.innerHTML += `
                        <div class="req-card">
                            <div style="flex: 1; min-width: 0; padding-right: 15px;">
                                <div class="req-title">${safeName}</div>
                                <div class="req-meta"><i class="fas fa-tag" style="color: var(--brand-color);"></i> ${safeCat}</div>
                                <div class="req-budget">Budget: ${fPrice}</div>
                            </div>
                            <button class="del-btn" onclick="deleteRequest('${safeIdJS}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    `;
                });

            } catch (e) {
                console.error(e);
            }
        }

        async function submitRequest(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                let uploadedImageUrl = null;
                if (selectedFile) {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading Image...';
                    uploadedImageUrl = await uploadToCloudinary(selectedFile);
                }

                const reqData = {
                    user_id: currentUser.id,
                    product_name: document.getElementById('r-name').value.trim(),
                    category: document.getElementById('r-cat').value,
                    budget: document.getElementById('r-budget').value,
                    description: document.getElementById('r-desc').value.trim(),
                    image_url: uploadedImageUrl 
                };

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Request...';
                
                const { error: insertErr } = await supabaseClient.from('requests').insert([reqData]);
                if (insertErr) throw insertErr;

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Notifying Vendors...';
                
                const { data: vendors } = await supabaseClient
                    .from('vendors')
                    .select('email')
                    .eq('is_active', true)
                    .ilike('categories', `%${reqData.category}%`);

                if (vendors && vendors.length > 0) {
                    const emailList = vendors.map(v => v.email).filter(e => e).join(','); 
                    
                    const templateParams = {
                        product_name: reqData.product_name,
                        category: reqData.category,
                        budget: "₦" + Number(reqData.budget).toLocaleString(),
                        description: reqData.description,
                        vendor_emails: emailList 
                    };

                    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams).catch(() => {}); 
                }

                alert("Request posted successfully!");
                document.getElementById('requestForm').reset();
                document.getElementById('img-preview').style.display = 'none';
                selectedFile = null;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Broadcast to Vendors';
                checkLimitsAndLoad(); 

            } catch (error) {
                alert("Failed to post request.");
                console.error(error);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Broadcast to Vendors';
            }
        }

        window.deleteRequest = async function(reqId) {
            if(!confirm("Are you sure you want to remove this request?")) return;
            try {
                await supabaseClient.from('requests').update({ status: 'Deleted' }).eq('id', reqId);
                checkLimitsAndLoad(); 
            } catch(e) {
                alert("Failed to delete.");
            }
        }
    </script>
</body>
</html>
