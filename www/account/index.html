<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Account | UNICAL Digital Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root {
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --brand-bg: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        .app-container {
            background: var(--brand-bg); width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative; z-index: 1;
        }

        .header {
            background: rgba(255, 255, 255, 0.95); padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
        }
        .back-btn { color: var(--text-main); text-decoration: none; font-size: 18px; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; background: #f1f5f9; border-radius: 50%; transition: 0.2s; }
        .back-btn:active { transform: scale(0.9); background: #e2e8f0; }
        .header-title { font-weight: 800; font-size: 18px; color: var(--text-main); letter-spacing: -0.3px;}

        /* 🚀 PREMIUM PROFILE CARD */
        .profile-card {
            background: white; border-radius: 24px; margin: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.03); position: relative; 
            overflow: hidden; border: 1px solid #e2e8f0;
        }
        
        .profile-header-bg {
            background: var(--brand-gradient);
            height: 110px; width: 100%; position: absolute; top: 0; left: 0; z-index: 0;
        }

        .profile-content { position: relative; z-index: 1; padding: 35px 20px 25px; text-align: center; margin-top: 25px; }

        .avatar-container {
            position: relative; width: 110px; height: 110px;
            margin: 0 auto 15px; cursor: pointer;
        }
        .profile-img {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 4px solid white; box-shadow: 0 8px 25px rgba(0,0,0,0.1); background: #eee;
        }
        .edit-badge {
            position: absolute; bottom: 0; right: 0;
            background: var(--text-main); color: white;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 14px; border: 3px solid white; transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .avatar-container:active .edit-badge { transform: scale(0.9); }
        
        .profile-name { font-size: 22px; font-weight: 900; color: var(--text-main); margin: 0 0 5px; letter-spacing: -0.5px;}
        .profile-email { font-size: 13px; font-weight: 600; color: var(--text-muted); margin: 0; }
        
        .user-badge {
            background: #f1f5f9; color: #475569; font-size: 12px; font-weight: 800;
            padding: 6px 16px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; margin-top: 15px;
        }
        .user-badge.vendor {
            background: #fff7ed; color: var(--brand-color); border: 1px solid #fed7aa;
        }

        /* 🚀 MENU LIST */
        .menu-wrapper { padding: 0 20px 30px; }
        .menu-title { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 25px 0 12px 5px; }
        
        .menu-btn {
            display: flex; align-items: center; background: white; padding: 12px 15px;
            border-radius: 16px; margin-bottom: 12px; text-decoration: none; color: var(--text-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: 0.2s; border: 1px solid #f1f5f9; width: 100%; cursor: pointer;
        }
        .menu-btn:active { transform: scale(0.98); background: #f8fafc; }
        
        /* Tinted Icon Boxes */
        .menu-icon-box {
            width: 40px; height: 40px; border-radius: 12px; display: flex; justify-content: center; align-items: center;
            font-size: 18px; margin-right: 15px; flex-shrink: 0;
        }
        
        .menu-text { flex: 1; font-size: 14px; font-weight: 700; text-align: left; }
        .chevron-icon { color: #cbd5e1; font-size: 14px; }

        /* Logout Button Specifics */
        .logout-btn { border-color: #fecaca; background: #fff5f5; }
        .logout-btn:active { background: #fee2e2; }

        #upload-loader {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); border-radius: 50%; border: 4px solid white;
            display: none; justify-content: center; align-items: center; font-size: 24px; color: var(--brand-color);
            backdrop-filter: blur(2px);
        }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES                        */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .header { background: rgba(15, 23, 42, 0.95) !important; border-bottom-color: #334155 !important; }
        body.dark-mode .header-title { color: #f1f5f9 !important; }
        body.dark-mode .back-btn { background: #1e293b !important; color: #f1f5f9 !important; }
        body.dark-mode .back-btn:active { background: #334155 !important; }

        body.dark-mode .profile-card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important; }
        body.dark-mode .profile-header-bg { background: linear-gradient(135deg, #ea580c, #9a3412) !important; }
        body.dark-mode .profile-name { color: #f1f5f9 !important; }
        body.dark-mode .profile-email { color: #94a3b8 !important; }
        body.dark-mode .profile-img { border-color: #1e293b !important; background: #334155 !important; }
        body.dark-mode .edit-badge { border-color: #1e293b !important; background: #f1f5f9 !important; color: #0f172a !important; }
        body.dark-mode #upload-loader { border-color: #1e293b !important; background: rgba(30, 41, 59, 0.8) !important; }

        body.dark-mode .user-badge { background: #334155 !important; color: #cbd5e1 !important; }
        body.dark-mode .user-badge.vendor { background: rgba(255, 122, 0, 0.15) !important; border-color: var(--brand-color) !important; color: var(--brand-color) !important; }

        body.dark-mode .menu-title { color: #64748b !important; }
        body.dark-mode .menu-btn { background: #1e293b !important; border-color: #334155 !important; color: #f1f5f9 !important; }
        body.dark-mode .menu-btn:active { background: #334155 !important; }
        body.dark-mode .menu-icon-box { background: #0f172a !important; }
        body.dark-mode .chevron-icon { color: #475569 !important; }
        
        body.dark-mode .logout-btn { background: rgba(239, 68, 68, 0.1) !important; border-color: #ef4444 !important; }
        body.dark-mode .logout-btn:active { background: rgba(239, 68, 68, 0.2) !important; }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <div class="app-container">
        
        <div class="header">
            <a href="../" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <span class="header-title">My Account</span>
            <div style="width: 40px;"></div> 
        </div>

        <div class="profile-card">
            <div class="profile-header-bg"></div>
            
            <div class="profile-content">
                <div class="avatar-container" onclick="document.getElementById('avatar-input').click()">
                    <img src="../img/person.png" id="user-img" class="profile-img" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 24 24\' fill=\'%23cbd5e1\'><path d=\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\'/></svg>'">
                    <div class="edit-badge"><i class="fas fa-camera"></i></div>
                    <div id="upload-loader"><i class="fas fa-spinner fa-spin"></i></div>
                </div>
                
                <input type="file" id="avatar-input" style="display: none;" accept="image/png, image/jpeg, image/jpg" onchange="handleAvatarUpload(event)">

                <h3 class="profile-name" id="user-name">Loading...</h3>
                <p class="profile-email" id="user-email">...</p>
                <div class="user-badge" id="user-role-badge"><i class="fas fa-user-graduate"></i> Student Account</div>
            </div>
        </div>

        <div class="menu-wrapper">
            
            <div class="menu-title">Marketplace</div>
            
            <a href="../view-requests/" class="menu-btn" id="btn-view-requests" style="display: none;">
                <div class="menu-icon-box" style="color: #FF7A00; background: rgba(255, 122, 0, 0.1);"><i class="fas fa-bullhorn"></i></div>
                <div class="menu-text">View Buyer Requests</div>
                <i class="fas fa-chevron-right chevron-icon"></i>
            </a>

            <a href="../profile-edit/" class="menu-btn" id="btn-edit-profile" style="display: none;">
                <div class="menu-icon-box" style="color: #8b5cf6; background: rgba(139, 92, 246, 0.1);"><i class="fas fa-store"></i></div>
                <div class="menu-text">Edit Store Settings</div>
                <i class="fas fa-chevron-right chevron-icon"></i>
            </a>

            <a href="../saved/" class="menu-btn">
                <div class="menu-icon-box" style="color: #ec4899; background: rgba(236, 72, 153, 0.1);"><i class="fas fa-heart"></i></div>
                <div class="menu-text">Saved Items</div>
                <i class="fas fa-chevron-right chevron-icon"></i>
            </a>

            <div class="menu-title">Support & Settings</div>

            <a href="../admin/" class="menu-btn" id="btn-admin-panel" style="display: none; border-left: 4px solid #f59e0b;">
                <div class="menu-icon-box" style="color: #f59e0b; background: rgba(245, 158, 11, 0.1);"><i class="fas fa-user-shield"></i></div>
                <div class="menu-text">Admin Command Center</div>
                <i class="fas fa-chevron-right chevron-icon"></i>
            </a>

            <a href="../user-settings/index.html" class="menu-btn">
                <div class="menu-icon-box" style="color: #3b82f6; background: rgba(59, 130, 246, 0.1);"><i class="fas fa-user-cog"></i></div>
                <div class="menu-text">Account Settings</div>
                <i class="fas fa-chevron-right chevron-icon"></i>
            </a>

            <a href="https://wa.me/2349153375488?text=hello%20admin" target="_blank" class="menu-btn">
                <div class="menu-icon-box" style="color: #10b981; background: rgba(16, 185, 129, 0.1);"><i class="fas fa-headset"></i></div>
                <div class="menu-text">Contact Admin</div>
                <i class="fas fa-chevron-right chevron-icon"></i>
            </a>

            <button onclick="logout()" class="menu-btn logout-btn" style="margin-top: 25px;">
                <div class="menu-icon-box" style="color: #ef4444; background: rgba(239, 68, 68, 0.1);"><i class="fas fa-sign-out-alt"></i></div>
                <div class="menu-text" style="color: #ef4444;">Log Out</div>
            </button>
            
        </div>
    </div>

   <script src="../asset/script.js"></script>

    <script>
        const CLOUD_NAME = "dj6yl36fq"; 
        const UPLOAD_PRESET = "unical_avatars"; 
        
        let currentUser = null;

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.href = "../login/index.html";
                return;
            }

            currentUser = session.user;
            document.getElementById('user-email').innerText = currentUser.email;

            // Fetch Profile Data
            const { data: profileData } = await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (profileData) {
                document.getElementById('user-name').innerText = escapeHTML(profileData.full_name) || "UNICAL Student";
                if (profileData.avatar_url) {
                    document.getElementById('user-img').src = profileData.avatar_url;
                }
            }

            // Fetch Vendor Data
            const { data: vendorData } = await supabaseClient
                .from('vendors')
                .select('id')
                .eq('profile_id', currentUser.id)
                .single();

            if (vendorData) {
                const badge = document.getElementById('user-role-badge');
                badge.innerHTML = '<i class="fas fa-check-circle" style="margin-right:4px;"></i> Vendor Account';
                badge.classList.add('vendor'); 

                document.getElementById('btn-view-requests').style.display = "flex";
                document.getElementById('btn-edit-profile').style.display = "flex";
            }

            // CHECK ADMIN STATUS
            const { data: adminData } = await supabaseClient
                .from('admin_users')
                .select('email')
                .eq('email', currentUser.email)
                .maybeSingle();

            if (adminData) {
                document.getElementById('btn-admin-panel').style.display = "flex";
            }
        });

        async function logout() {
            if (confirm("Are you sure you want to log out?")) {
                await supabaseClient.auth.signOut();
                window.location.href = "../index.html"; 
            }
        }

        async function compressImage(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width; let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loader = document.getElementById('upload-loader');
            loader.style.display = "flex"; 

            try {
                const compressedFile = await compressImage(file);

                const formData = new FormData();
                formData.append('file', compressedFile);
                formData.append('upload_preset', UPLOAD_PRESET); 

                const cloudinaryRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                const cloudinaryData = await cloudinaryRes.json();
                if (!cloudinaryRes.ok) throw new Error(cloudinaryData.error.message);

                const finalImageUrl = cloudinaryData.secure_url;

                const { error: dbError } = await supabaseClient
                    .from('profiles')
                    .update({ avatar_url: finalImageUrl })
                    .eq('id', currentUser.id);

                if (dbError) throw dbError;

                document.getElementById('user-img').src = finalImageUrl;
                alert("Profile picture updated successfully!");

          } catch (error) {
                console.error("Full upload error:", error);
                let errorMessage = error.message || error.details || "Unknown database error";
                alert("Upload Failed! Reason: " + errorMessage);
            } finally {
                loader.style.display = "none"; 
            }
        }
    </script>
</body>
</html>
