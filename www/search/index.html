<!DOCTYPE html>
<html lang="en">
<head>
     <script>
        window.location.replace("../coming-soon/");
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search Results | UNICAL Digital Market</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <meta name="theme-color" content="#FF7A00">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="../apple-touch-icon.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

        /* 🚀 Reset & Variables */
        * { box-sizing: border-box; }
        :root {
            --brand-color: #FF7A00; 
            --brand-gradient: linear-gradient(135deg, #FF7A00, #ea580c);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #e2e8f0; 
            margin: 0; padding: 0; 
            display: flex; justify-content: center; min-height: 100vh;
            color: var(--text-main);
        }

        .app-container {
            background: #f8fafc; width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 0 40px rgba(0,0,0,0.1); display: flex; flex-direction: column;
            position: relative;
        }

        /* 🚀 Glassmorphic Header & Search Bar */
        .header {
            background: rgba(255, 255, 255, 0.9); padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        
        .search-header-row { display: flex; align-items: center; gap: 15px; width: 100%; }
        .back-btn { background: white; color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 1px solid #e2e8f0; font-size: 16px; cursor: pointer; transition: 0.2s; flex-shrink: 0;}
        .back-btn:active { transform: scale(0.9); background: #f1f5f9; }

        .search-input-wrapper { 
            flex: 1; background: #f1f5f9; border-radius: 20px; display: flex; 
            align-items: center; padding: 12px 18px; margin: 0; border: 2px solid transparent; transition: 0.2s;
        }
        .search-input-wrapper:focus-within { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(255, 122, 0, 0.1); }
        .search-input-wrapper input[type="search"] { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; font-weight: 500; color: var(--text-main); font-family: inherit; -webkit-appearance: none; }
        .search-input-wrapper i { color: #94a3b8; margin-right: 12px; cursor: pointer; font-size: 16px; }

        /* 🚀 Filter Row */
        .filter-row { 
            display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; 
            padding: 15px 20px 0; align-items: center; 
        }
        .filter-input { 
            width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; 
            border-radius: 12px; font-size: 13px; font-weight: 600; outline: none; 
            background: white; box-sizing: border-box; font-family: inherit; transition: 0.2s;
        }
        .filter-input:focus { border-color: var(--brand-color); box-shadow: 0 4px 10px rgba(255, 122, 0, 0.1);}
        
        .filter-btn { 
            background: var(--text-main); color: white; border: none; 
            border-radius: 12px; padding: 0 20px; height: 100%; min-height: 44px; 
            font-weight: 800; font-size: 13px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .filter-btn:active { transform: scale(0.95); background: #334155;}

        /* Typography & Layout */
        .section-wrapper { padding: 0 20px; margin-top: 25px;}
        .section-title { font-size: 18px; font-weight: 900; color: var(--text-main); letter-spacing: -0.3px; }
        .result-count-text { font-size: 13px; color: var(--brand-color); font-weight: 700; margin-bottom: 15px; }
        
        /* 🚀 Empty State */
        .empty-state { text-align: center; padding: 50px 20px; background: white; border-radius: 24px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.02);}
        .empty-state i { font-size: 45px; color: #cbd5e1; margin-bottom: 15px; }
        .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0 0 8px; letter-spacing: -0.5px;}
        .empty-state p { font-size: 13px; font-weight: 500; color: var(--text-muted); margin: 0;}

        /* 🚀 Grids & Cards */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .card { 
            background: white; border-radius: 18px; padding: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.03); border: 1px solid #f1f5f9; 
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column;
        }
        .card:active { transform: scale(0.97); background: #f8fafc; }
        .card-img { width: 100%; height: 130px; object-fit: cover; border-radius: 12px; background: #eee; margin-bottom: 10px; }
        .card-price { font-size: 15px; font-weight: 900; color: var(--brand-color); margin-bottom: 4px; }
        .card-title { font-size: 13px; font-weight: 700; color: var(--text-main); line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

        /* 🚀 Full Width View All Buttons */
        .full-width-btn {
            display: flex; justify-content: center; align-items: center; width: 100%; 
            background: white; color: var(--text-main); border: 2px solid #e2e8f0; 
            font-weight: 800; font-size: 14px; padding: 16px; border-radius: 16px; 
            text-decoration: none; margin-top: 20px; transition: 0.2s;
        }
        .full-width-btn:active { background: #f8fafc; border-color: var(--brand-color); color: var(--brand-color); transform: scale(0.98);}

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { background: white; border-radius: 18px; padding: 12px; border: 1px solid #f1f5f9; display: flex; flex-direction: column; height: 100%; }
        .sk-img { width: 100%; height: 130px; border-radius: 12px; margin-bottom: 12px; flex-shrink: 0; }
        .sk-v-avatar { width: 70px; height: 70px; border-radius: 50%; margin: 10px auto 15px; flex-shrink: 0; }
        .sk-line { height: 14px; border-radius: 6px; margin-bottom: 8px; }
        .sk-line.short { width: 40%; }
        .sk-line.medium { width: 70%; }
        .sk-line.long { width: 100%; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES FOR SEARCH PAGE        */
        /* ========================================= */
        body.dark-mode { background-color: #020617 !important; }
        body.dark-mode .app-container { background: #0f172a !important; box-shadow: none; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;}
        
        body.dark-mode .header { background: rgba(15, 23, 42, 0.95) !important; border-bottom-color: #334155 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important; }
        body.dark-mode .back-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important;}
        body.dark-mode .back-btn:active { background: #334155 !important; }
        
        body.dark-mode .search-input-wrapper { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .search-input-wrapper:focus-within { border-color: var(--brand-color) !important; }
        body.dark-mode .search-input-wrapper input { color: #f1f5f9 !important; }
        
        body.dark-mode .filter-input { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
        body.dark-mode .filter-input:focus { border-color: var(--brand-color) !important; }
        body.dark-mode .filter-btn { background: #f1f5f9 !important; color: #0f172a !important; }
        body.dark-mode .filter-btn:active { background: #cbd5e1 !important; }
        
        body.dark-mode .section-title { color: #f1f5f9 !important; }
        
        body.dark-mode .empty-state { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .empty-state h3 { color: #f1f5f9 !important; }
        body.dark-mode .empty-state p { color: #94a3b8 !important; }
        body.dark-mode .empty-state i { color: #334155 !important; }
        
        body.dark-mode .card { background: #1e293b !important; border-color: #334155 !important; box-shadow: 0 8px 25px rgba(0,0,0,0.5) !important; }
        body.dark-mode .card:active { background: #334155 !important; }
        body.dark-mode .card-title { color: #f1f5f9 !important; }
        body.dark-mode .card-desc { color: #94a3b8 !important; }
        
        body.dark-mode .full-width-btn { background: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
        body.dark-mode .full-width-btn:active { background: #334155 !important; border-color: var(--brand-color) !important; color: var(--brand-color) !important; }

        body.dark-mode .sk-card { background: #1e293b !important; border-color: #334155 !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');</script>

    <div class="app-container">
        
        <div class="header">
            <div class="search-header-row">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                
                <form class="search-input-wrapper" action="#" onsubmit="return triggerSearch(event)">
                    <i class="fas fa-search" onclick="triggerSearch(event)"></i>
                    <input type="search" id="search-input" placeholder="Search for items, vendors...">
                </form>
            </div>
        </div>

        <div class="filter-row">
            <input type="number" id="min-price" class="filter-input" placeholder="Min (₦)">
            <input type="number" id="max-price" class="filter-input" placeholder="Max (₦)">
            <button class="filter-btn" onclick="applyFilters()">Filter</button>
        </div>

        <div class="content-area" style="padding-bottom: 110px;">
            
            <div class="section-wrapper" id="items-section">
                <div class="section-title">Matched Items</div>
                <div class="result-count-text" id="items-count">Searching...</div>
                
                <div class="product-grid" id="matched-items-grid">
                    <!-- Skeletons -->
                    <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-shimmer sk-line short"></div><div class="sk-shimmer sk-line long"></div><div class="sk-shimmer sk-line medium"></div></div>
                    <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-shimmer sk-line short"></div><div class="sk-shimmer sk-line long"></div><div class="sk-shimmer sk-line medium"></div></div>
                </div>
            </div>

            <div class="section-wrapper" id="vendors-section">
                <div class="section-title">Matched Vendors</div>
                <div class="result-count-text" id="vendors-count">Searching...</div>
                
                <div class="product-grid" id="matched-vendors-grid">
                    <!-- Skeletons -->
                    <div class="sk-card" style="align-items: center;"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                    <div class="sk-card" style="align-items: center;"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                </div>
            </div>

            <hr style="border: 0; border-top: 4px solid #e2e8f0; margin: 30px 20px;">

            <div class="section-wrapper">
                <div class="section-title" style="margin-bottom: 15px;">Explore More Items</div>
                <div class="product-grid" id="explore-items-grid"></div>
                <a href="../items/index.html" class="full-width-btn">Go to All Items</a>
            </div>

            <div class="section-wrapper">
                <div class="section-title" style="margin-bottom: 15px; margin-top: 15px;">Explore Vendors</div>
                <div class="product-grid" id="explore-vendors-grid"></div>
                <a href="../vendors/index.html" class="full-width-btn">Explore More Vendors</a>
            </div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span><span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')"><i class="fas fa-user"></i><span>Account</span></a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let allProducts = [];
        let allVendors = [];
        let currentQuery = "";

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function requireLogin(targetUrl) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentQuery = urlParams.get('q') || "";
            document.getElementById('search-input').value = currentQuery;

            await fetchAllData();
            executeSearch();
        });

        function triggerSearch(e) {
            if (e) e.preventDefault(); 
            
            document.getElementById('search-input').blur(); 
            
            const newQuery = document.getElementById('search-input').value.trim();
            window.history.replaceState(null, '', `?q=${encodeURIComponent(newQuery)}`);
            currentQuery = newQuery;
            executeSearch();
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return false; 
        }

        async function fetchAllData() {
            try {
                const { data: pData } = await supabaseClient.from('products').select('id, name, price, image_urls, category, description').eq('status', 'Active');
                if (pData) allProducts = pData;

                const { data: vData } = await supabaseClient.from('vendors').select('id, business_name, description, logo_url, subscription_plan').eq('is_active', true);
                if (vData) allVendors = vData;
            } catch (error) { console.error("Database fetch error."); }
        }

        function executeSearch() {
            const minPrice = parseFloat(document.getElementById('min-price').value) || 0;
            const maxPrice = parseFloat(document.getElementById('max-price').value) || Infinity;
            const queryLower = currentQuery.toLowerCase();

            const matchedItems = allProducts.filter(p => {
                const matchesText = (p.name && p.name.toLowerCase().includes(queryLower)) || 
                                    (p.description && p.description.toLowerCase().includes(queryLower)) ||
                                    (p.category && p.category.toLowerCase().includes(queryLower));
                const matchesPrice = p.price >= minPrice && p.price <= maxPrice;
                return matchesText && matchesPrice;
            });

            renderItemsGrid(matchedItems, 'matched-items-grid', 'items-count');

            const matchedVendors = allVendors.filter(v => {
                return (v.business_name && v.business_name.toLowerCase().includes(queryLower)) || 
                       (v.description && v.description.toLowerCase().includes(queryLower));
            });

            renderVendorsGrid(matchedVendors, 'matched-vendors-grid', 'vendors-count');

            // 🚀 SMART RANDOMIZERS (30 Items, 14 Vendors)
            const randomItems = shuffleArray([...allProducts]).slice(0, 30);
            renderItemsGrid(randomItems, 'explore-items-grid', null);

            const randomVendors = shuffleArray([...allVendors]).slice(0, 14);
            renderVendorsGrid(randomVendors, 'explore-vendors-grid', null);
        }

        function applyFilters() { executeSearch(); }

        function renderItemsGrid(itemsArray, containerId, countId) {
            const grid = document.getElementById(containerId);
            if (countId) document.getElementById(countId).innerText = itemsArray.length === 0 ? "No items found." : `Found ${itemsArray.length} items`;

            if (itemsArray.length === 0 && countId) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: span 2;">
                        <i class="fas fa-box-open"></i>
                        <h3>No items matched your search</h3>
                        <p>Try adjusting your filters or spelling.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = "";
            itemsArray.forEach(p => {
                const imgUrl = escapeHTML((p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300');
                const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);

                grid.insertAdjacentHTML('beforeend', `
                    <div class="card" onclick="window.location.href='../product/index.html?id=${escapeJS(p.id)}'">
                        <img src="${imgUrl}" class="card-img" onerror="this.src='https://via.placeholder.com/300'">
                        <div class="card-price">${fPrice}</div>
                        <div style="flex:1;">
                            <div class="card-title">${escapeHTML(p.name)}</div>
                            <div class="card-desc">${escapeHTML(p.category)}</div>
                        </div>
                    </div>
                `);
            });
        }

        function renderVendorsGrid(vendorsArray, containerId, countId) {
            const grid = document.getElementById(containerId);
            if (countId) document.getElementById(countId).innerText = vendorsArray.length === 0 ? "No vendors found." : `Found ${vendorsArray.length} vendors`;

            if (vendorsArray.length === 0 && countId) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: span 2;">
                        <i class="fas fa-store-slash"></i>
                        <h3>No vendors matched your search</h3>
                        <p>Try searching by business name.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = "";
            vendorsArray.forEach(v => {
                const logo = escapeHTML(v.logo_url || "https://via.placeholder.com/150");
                const descTxt = escapeHTML(v.description ? v.description.substring(0, 25) + '...' : 'Verified Seller');
                const safeName = escapeHTML(v.business_name);

                let badgeColor = "#38bdf8"; 
                if (v.subscription_plan === "Influencer") badgeColor = "#fbbf24"; 
                if (v.subscription_plan === "Icon") badgeColor = "#1e293b"; 

                grid.insertAdjacentHTML('beforeend', `
                    <div class="card" style="text-align: center; display: flex; flex-direction: column; align-items: center; height: 100%;" onclick="window.location.href='../vendors/profile/index.html?id=${escapeJS(v.id)}'">
                        <img src="${logo}" style="width: 75px; height: 75px; border-radius: 50%; margin: 10px auto 15px; flex-shrink: 0; object-fit: cover; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);" onerror="this.src='https://via.placeholder.com/150'">
                        <div style="width: 100%; flex: 1;">
                            <div class="card-title" style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;">
                                ${safeName} <i class="fas fa-check-circle" style="color: ${badgeColor}; font-size: 12px;"></i>
                            </div>
                            <div class="card-desc" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${descTxt}</div>
                        </div>
                    </div>
                `);
            });
        }
    </script>
</body>
</html>
